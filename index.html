<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>樂華天主教小學 - 時間表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0c1526;
  --navy-800:#101c33;
  --navy-700:#16233e;
  --blue-600:#3457d5;
  --blue-500:#4a6bea;
  --blue-100:#e7ecfc;
  --amber-500:#e5922e;
  --amber-100:#fbe9d3;
  --red-500:#e0524a;
  --red-100:#fbdedc;
  --violet-500:#8b5fc9;
  --violet-100:#ece3f8;
  --grey-400:#94a3b8;
  --grey-100:#eef1f6;
  --bg:#f3f5fa;
  --card:#ffffff;
  --border:#e3e7f0;
  --text:#1b2436;
  --text-muted:#667085;
  --today-ring:#3457d5;
  --radius:12px;
  --font-cjk:'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-num:'Inter', var(--font-cjk);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-cjk);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}

/* ---------- App shell ---------- */
.app{
  max-width:1400px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar (school name + teacher select) ---------- */
.topbar{
  background:var(--navy-900);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  row-gap:10px;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  row-gap:8px;
}
.school-name{
  color:#fff;
  font-weight:700;
  font-size:15px;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:8px;
}
.school-name .sub{
  color:#8fa0c9;
  font-weight:500;
  font-size:12.5px;
}
.entity-select-wrap{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
}
.entity-select-wrap label{
  color:#8fa0c9;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
}
select#entitySelect{
  appearance:none;
  -webkit-appearance:none;
  background:var(--navy-700) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238fa0c9"/></svg>') no-repeat right 12px center;
  color:#fff;
  border:1px solid #263457;
  border-radius:8px;
  padding:8px 32px 8px 14px;
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  min-width:170px;
}
select#entitySelect:focus{outline:2px solid var(--blue-500); outline-offset:1px;}

.mode-toggle{
  display:flex;
  background:var(--navy-700);
  border:1px solid #263457;
  border-radius:9px;
  overflow:hidden;
  flex:0 0 auto;
}
.mode-toggle button{
  border:none;
  background:transparent;
  color:#9fb0d6;
  font-weight:700;
  font-size:13px;
  padding:8px 14px;
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.mode-toggle button.active{
  background:var(--blue-600);
  color:#fff;
}

/* ---------- Header / calendar controls ---------- */
.calheader{
  background:var(--navy-800);
  color:#fff;
  padding:12px 20px;
}
.calheader-title{
  text-align:center;
  font-family:var(--font-num);
  font-weight:800;
  font-size:clamp(14px, 2.6vw, 20px);
  letter-spacing:.4px;
  flex:1 1 auto;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.calheader-title .weekbadge{
  display:inline-block;
  margin-left:8px;
  font-size:11.5px;
  font-weight:600;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:2.5px 9px;
  border-radius:20px;
  vertical-align:middle;
  color:#c8d3ee;
  letter-spacing:0;
  white-space:nowrap;
}
.calheader-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.nav-group{
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
  flex:0 0 auto;
}
.icon-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#e7ecfc;
  width:36px;
  height:36px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:#1c2a4a;}
.icon-btn:active{transform:translateY(1px);}
.today-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#fff;
  height:36px;
  padding:0 16px;
  border-radius:9px;
  font-weight:600;
  font-size:13.5px;
}
.today-btn:hover{background:#1c2a4a;}
.view-toggle{
  display:flex;
  background:var(--navy-700);
  border:1px solid #263457;
  border-radius:9px;
  overflow:hidden;
  flex:0 0 auto;
}
.view-toggle button{
  border:none;
  background:transparent;
  color:#9fb0d6;
  font-weight:700;
  font-size:13.5px;
  padding:8px 18px;
  transition:background .15s,color .15s;
}
.view-toggle button.active{
  background:var(--blue-600);
  color:#fff;
}

/* Calendar popover */
.calendar-pop{
  position:absolute;
  top:44px;
  left:0;
  z-index:50;
  background:#fff;
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:0 12px 32px rgba(10,20,50,.28);
  width:300px;
  padding:14px;
  display:none;
}
.calendar-pop.open{display:block;}
.calendar-pop-tabs{
  display:flex;
  background:var(--grey-100);
  border-radius:8px;
  padding:3px;
  margin-bottom:12px;
}
.calendar-pop-tabs button{
  flex:1;
  border:none;
  background:transparent;
  padding:7px 0;
  font-size:12.5px;
  font-weight:700;
  border-radius:6px;
  color:var(--text-muted);
}
.calendar-pop-tabs button.active{
  background:#fff;
  color:var(--blue-600);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.cp-panel{display:none;}
.cp-panel.active{display:block;}
.cp-month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.cp-month-nav .label{font-weight:700; font-size:14px;}
.cp-month-nav button{
  background:var(--grey-100);
  border:none;
  width:26px;height:26px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.cp-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  text-align:center;
}
.cp-grid .dow{
  font-size:11px;
  color:var(--text-muted);
  font-weight:700;
  padding-bottom:4px;
}
.cp-day{
  font-size:12.5px;
  padding:6px 0;
  border-radius:6px;
  font-family:var(--font-num);
  color:var(--text);
  background:transparent;
  border:none;
}
.cp-day.out{color:#c8cedb;}
.cp-day.weekend{color:#c8cedb; cursor:default;}
.cp-day.school:hover{background:var(--blue-100); cursor:pointer;}
.cp-day.today{box-shadow:inset 0 0 0 1.5px var(--blue-600); font-weight:800;}
.cp-day.selected{background:var(--blue-600); color:#fff; font-weight:800;}
.cp-day.disabled{cursor:default; color:#dde1ea;}
.week-list{max-height:280px; overflow-y:auto;}
.week-item{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:12.5px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.week-item:hover{border-color:var(--blue-500); background:var(--blue-100);}
.week-item b{font-family:var(--font-num); color:var(--blue-600); font-size:13px;}
.week-item .range{color:var(--text-muted); font-size:11.5px; font-family:var(--font-num);}

/* ---------- Grid ---------- */
.grid-wrap{
  flex:1;
  overflow-x:auto;
  background:var(--card);
  padding:0 0 24px 0;
}
table.tt{
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  table-layout:fixed;
  min-width:640px;
}
table.tt th, table.tt td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
}
table.tt th:first-child, table.tt td:first-child{border-left:1px solid var(--border);}

.col-label{width:110px;}
body.day-view table.tt{min-width:0;}
body.day-view table.tt .col-label{width:96px;}
body.day-view th.daycol{min-width:0;}

th.corner{
  background:var(--grey-100);
  color:var(--text-muted);
  font-size:12px;
  font-weight:700;
  padding:10px 8px;
  border-top:1px solid var(--border);
  position:sticky; left:0; z-index:3;
}
th.daycol{
  background:#fff;
  color:var(--text);
  padding:10px 6px 12px;
  text-align:center;
  border-top:1px solid var(--border);
  min-width:120px;
}
th.daycol .wd{font-size:12.5px; font-weight:600; color:var(--text-muted);}
th.daycol .dnum{font-family:var(--font-num); font-size:22px; font-weight:800; line-height:1.25; margin:1px 0 4px; color:var(--text);}
th.daycol.is-today{background:var(--blue-600);}
th.daycol.is-today .wd{color:#cfdbfa;}
th.daycol.is-today .dnum{color:#fff;}
.badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:2.5px 9px;
  border-radius:20px;
  background:var(--blue-600);
  color:#fff;
}
th.daycol.is-today .badge{background:rgba(255,255,255,.92); color:var(--blue-600);}
.badge.unset{background:var(--grey-400); color:#fff;}
.badge.special-S{background:var(--amber-100); color:#8a5216;}
.badge.special-E{background:var(--red-100); color:#9c332c;}
.badge.special-TD{background:var(--violet-100); color:#5b3a8f;}

td.period-label{
  background:var(--grey-100);
  padding:9px 10px;
  font-size:12.5px;
  font-weight:700;
  color:var(--text);
  vertical-align:middle;
  position:sticky; left:0; z-index:2;
  line-height:1.5;
}
td.period-label .time{display:block; font-size:11px; font-weight:500; color:var(--text-muted); font-family:var(--font-num);}

tr.fixed-row td.cell{
  background:repeating-linear-gradient(135deg, #eef1f8, #eef1f8 6px, #e5e9f3 6px, #e5e9f3 12px);
}
tr.fixed-row td.period-label{background:var(--grey-100);}

td.cell{
  padding:8px 8px;
  vertical-align:middle;
  text-align:center;
  font-size:12.5px;
  height:52px;
  color:var(--text);
}
td.cell .subj{font-weight:700; display:block; margin-bottom:3px;}
td.cell .loc{display:block; font-size:11px; color:var(--text-muted);}
td.cell .loc-wrap{display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap;}
td.cell .room{font-size:10.5px; opacity:.75;}
td.cell .class-chip{
  display:inline-block;
  font-family:var(--font-num);
  font-size:11px;
  font-weight:800;
  opacity:.85;
}
td.cell .fixed-main{font-weight:700; display:block;}
td.cell .fixed-sub{display:block; font-size:11px; color:var(--text-muted); margin-top:2px;}
td.cell.empty{color:#d7dbe6;}
td.cell.empty::before{content:"—";}
td.cell.merged{font-weight:700; color:var(--text); letter-spacing:.5px;}

td.cell.clickable{cursor:pointer; transition:box-shadow .12s, transform .12s;}
td.cell.clickable:hover{box-shadow:inset 0 0 0 2px var(--blue-500); }
td.cell.clickable:active{transform:scale(0.98);}

/* ---------- Free-teacher modal ---------- */
.free-modal-backdrop{
  position:fixed; inset:0;
  background:rgba(10,16,32,.45);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.free-modal-backdrop.open{display:flex;}
.free-modal{
  background:#fff;
  color:var(--text);
  border-radius:14px;
  width:min(92vw, 380px);
  max-height:80vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 20px 60px rgba(10,20,50,.35);
}
.free-modal-header{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--grey-100);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.free-modal-title{font-weight:800; font-size:15px; line-height:1.4;}
.free-modal-title .sub{display:block; font-weight:600; font-size:12px; color:var(--text-muted); margin-top:2px;}
.free-modal-close{
  background:var(--grey-100);
  border:none;
  width:28px; height:28px;
  border-radius:8px;
  flex:0 0 auto;
  color:var(--text-muted);
  font-size:16px;
  line-height:1;
  cursor:pointer;
}
.free-modal-body{
  padding:14px 18px 18px;
  overflow-y:auto;
}
.free-modal-count{
  font-size:12.5px;
  color:var(--text-muted);
  margin-bottom:10px;
  font-weight:600;
}
.free-teacher-grid{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.free-teacher-chip{
  background:var(--blue-100);
  color:var(--blue-600);
  font-size:12.5px;
  font-weight:700;
  padding:6px 12px;
  border-radius:20px;
}
.free-modal-empty{
  color:var(--text-muted);
  font-size:13px;
  padding:8px 0;
  text-align:center;
}

/* ---------- 調堂記錄 (reschedule) view ---------- */
.reschedule-view{display:none; padding:16px 20px 40px; max-width:900px; margin:0 auto;}
.reschedule-toolbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 20px; background:#fff; border-bottom:1px solid var(--grey-100);
}
.reschedule-status{font-size:12.5px; color:var(--text-muted); font-weight:600;}
.reschedule-status.err{color:#c0392b;}
.reschedule-status.ok{color:#1e8e5a;}
.reschedule-view-toggle{
  display:flex; background:var(--grey-50, #f4f6fb); border-radius:8px; overflow:hidden;
  margin-left:auto;
}
.reschedule-view-toggle button{
  border:none; background:transparent; color:var(--text-muted);
  font-weight:700; font-size:12.5px; padding:7px 14px;
}
.reschedule-view-toggle button.active{background:var(--blue-600); color:#fff;}
.reschedule-add-btn{
  background:var(--blue-600); color:#fff; border:none;
  padding:10px 18px; border-radius:9px; font-weight:700; font-size:13.5px;
  cursor:pointer; flex:0 0 auto;
}
.reschedule-add-btn:hover{filter:brightness(1.08);}
.reschedule-list{display:flex; flex-direction:column; border:1px solid var(--grey-100); border-radius:10px; overflow:hidden; background:#fff;}
.reschedule-empty{
  text-align:center; color:var(--text-muted); font-size:13.5px; padding:40px 0;
}

/* ---------- 調堂記錄 grid cells (in the shared timetable grid) ---------- */
td.cell.rg-cell{padding:3px; vertical-align:top;}
.rg-cell-stack{display:flex; flex-direction:column; gap:3px;}
.rg-record-box{
  border:1px solid; border-radius:6px; padding:4px 6px; font-size:11px;
  font-weight:700; line-height:1.35; text-align:left; cursor:pointer;
}
.rg-record-note{font-size:9.5px; font-weight:500; opacity:.8; margin-top:1px;}
.rg-add-btn{
  border:1px dashed var(--grey-100); border-radius:6px; text-align:center;
  color:#c7cedb; font-size:12px; padding:2px 0; cursor:pointer; line-height:1.4;
}
.rg-add-btn:hover{border-color:var(--blue-500); color:var(--blue-600); background:#f3f7ff;}

/* Compact single-line list rows: fixed-width date/note columns keep every
   row the same height no matter how many entries it has, so the list stays
   easy to scan -- the entries column truncates with an ellipsis and shows
   the full text on hover (title attribute) rather than wrapping. */
.reschedule-search-wrap{padding:10px 14px; border-bottom:1px solid var(--grey-100); display:none; gap:8px;}
.reschedule-search-wrap.active{display:flex;}
.reschedule-search-wrap input{
  flex:1; min-width:0; border:1px solid var(--grey-100); border-radius:8px;
  padding:8px 12px; font-size:13px; font-family:inherit; color:var(--text);
}
.reschedule-search-wrap input:focus{outline:2px solid var(--blue-500); outline-offset:0;}
.reschedule-search-wrap select{
  flex:0 0 auto; border:1px solid var(--grey-100); border-radius:8px;
  padding:8px 10px; font-size:13px; font-family:inherit; color:var(--text); background:#fff;
}
.reschedule-search-wrap select:focus{outline:2px solid var(--blue-500); outline-offset:0;}
.rs-month-header{
  padding:10px 14px 6px; font-size:12.5px; font-weight:800; color:var(--text-muted);
  background:#f7f8fb; border-bottom:1px solid var(--grey-100); letter-spacing:.3px;
}
.rs-card{
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; cursor:pointer; border-bottom:1px solid var(--grey-100);
  font-size:13.5px;
}
.rs-card:last-child{border-bottom:none;}
.rs-card:hover{background:#f8f9fc;}
.rs-when{
  font-weight:800; font-size:12.5px; color:var(--text); flex:0 0 205px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.rs-load-more{
  display:block; width:100%; background:none; border:none; border-top:1px dashed var(--grey-100);
  color:var(--blue-600); font-weight:700; font-size:12.5px; padding:12px 14px; cursor:pointer;
}
.rs-load-more:hover{background:#f3f7ff;}
.rs-entries-inline{
  flex:1; min-width:0; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.rs-e{font-weight:700;}
.rs-e.special{color:#c0392b;}
.rs-sep{color:var(--text-muted);}
.rs-note-inline{
  flex:0 0 130px; font-size:12px; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- 共同空堂 (mutual free periods) ---------- */
.mf-view{display:none; padding:20px; max-width:760px; margin:0 auto;}
.mf-view.active{display:block;}
.mf-card{background:#fff; border:1px solid var(--grey-100); border-radius:14px; padding:20px; margin-bottom:20px;}
.mf-card-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.mf-badge-num{
  width:26px; height:26px; border-radius:50%; background:var(--navy-700); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:0 0 auto;
}
.mf-card-head h3{font-size:16px; margin:0; font-weight:800; color:var(--text);}
.mf-card-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:14px; line-height:1.5;}
.mf-combo{position:relative; display:flex; align-items:center; border:1px solid var(--grey-100); border-radius:10px; padding:10px 14px; margin-bottom:12px;}
.mf-combo input{flex:1; border:none; outline:none; font-size:13.5px; font-family:inherit; color:var(--text); min-width:0;}
.mf-combo-toggle{background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; padding:0 4px; flex:0 0 auto;}
.mf-dropdown{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
  border:1px solid var(--grey-100); border-radius:10px; max-height:260px; overflow-y:auto;
  box-shadow:0 8px 24px rgba(20,30,60,.14); z-index:50; display:none;
}
.mf-dropdown.open{display:block;}
.mf-dropdown-item{padding:9px 14px; cursor:pointer; font-size:13.5px; display:flex; gap:8px; align-items:center;}
.mf-dropdown-item:hover{background:#f3f6fb;}
.mf-dropdown-empty{padding:12px 14px; font-size:12.5px; color:var(--text-muted); text-align:center;}
.mf-chips{display:flex; flex-wrap:wrap; gap:8px;}
.mf-chip{
  display:flex; align-items:center; gap:7px; background:var(--navy-700); color:#fff;
  border-radius:20px; padding:7px 8px 7px 12px; font-weight:700; font-size:12.5px;
}
.mf-chip-short{
  background:rgba(255,255,255,.2); border-radius:50%; width:20px; height:20px;
  display:flex; align-items:center; justify-content:center; font-size:11px; flex:0 0 auto;
}
.mf-chip-remove{

<script type="module">
  // ====== Firebase (調堂記錄) ======
  // Loaded as an ES module from Google's CDN -- no npm/build step needed, so the
  // app stays a single self-contained HTML file. Exposes a small bridge on
  // window.__fb for the plain-script app logic below to call.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEJyBCb6wOlmTCe_5sga1w5y1bh1HTfyE",
    authDomain: "timetable-baa8f.firebaseapp.com",
    projectId: "timetable-baa8f",
    storageBucket: "timetable-baa8f.firebasestorage.app",
    messagingSenderId: "96682796202",
    appId: "1:96682796202:web:d310d81609f65c58fadcd3"
  };

  let db = null;
  let reschedulesCol = null;
  try {
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
    reschedulesCol = collection(db, 'reschedules');
  } catch(err){
    console.error('Firebase init failed', err);
  }

  window.__fb = {
    ready: !!db,
    listenReschedules(onData, onError){
      if(!reschedulesCol){ onError && onError(new Error('Firebase 未能初始化')); return () => {}; }
      const q = query(reschedulesCol, orderBy('date', 'desc'));
      return onSnapshot(q, snap => {
        const records = [];
        snap.forEach(d => records.push(Object.assign({id: d.id}, d.data())));
        onData(records);
      }, err => {
        console.error('Firestore onSnapshot error', err);
        onError && onError(err);
      });
    },
    async addReschedule(data){
      if(!reschedulesCol) throw new Error('Firebase 未能初始化');
      return addDoc(reschedulesCol, Object.assign({}, data, {
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      }));
    },
    async updateReschedule(id, data){
      if(!db) throw new Error('Firebase 未能初始化');
      return updateDoc(doc(db, 'reschedules', id), Object.assign({}, data, {
        updatedAt: serverTimestamp()
      }));
    },
    async deleteReschedule(id){
      if(!db) throw new Error('Firebase 未能初始化');
      return deleteDoc(doc(db, 'reschedules', id));
    }
  };
  window.dispatchEvent(new CustomEvent('fb-bridge-ready'));
