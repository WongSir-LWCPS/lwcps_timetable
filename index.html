<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>樂華天主教小學 - 時間表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0c1526;
  --navy-800:#101c33;
  --navy-700:#16233e;
  --blue-600:#3457d5;
  --blue-500:#4a6bea;
  --blue-100:#e7ecfc;
  --amber-500:#e5922e;
  --amber-100:#fbe9d3;
  --red-500:#e0524a;
  --red-100:#fbdedc;
  --violet-500:#8b5fc9;
  --violet-100:#ece3f8;
  --grey-400:#94a3b8;
  --grey-100:#eef1f6;
  --bg:#f3f5fa;
  --card:#ffffff;
  --border:#e3e7f0;
  --text:#1b2436;
  --text-muted:#667085;
  --today-ring:#3457d5;
  --radius:12px;
  --font-cjk:'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-num:'Inter', var(--font-cjk);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-cjk);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}

/* ---------- App shell ---------- */
.app{
  max-width:1400px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar (school name + teacher select) ---------- */
.topbar{
  background:var(--navy-900);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  row-gap:10px;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  row-gap:8px;
}
.school-name{
  color:#fff;
  font-weight:700;
  font-size:15px;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:8px;
}
.school-name .sub{
  color:#8fa0c9;
  font-weight:500;
  font-size:12.5px;
}
.entity-select-wrap{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
}
.entity-select-wrap label{
  color:#8fa0c9;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
}
select#entitySelect{
  appearance:none;
  -webkit-appearance:none;
  background:var(--navy-700) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238fa0c9"/></svg>') no-repeat right 12px center;
  color:#fff;
  border:1px solid #263457;
  border-radius:8px;
  padding:8px 32px 8px 14px;
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  min-width:170px;
}
select#entitySelect:focus{outline:2px solid var(--blue-500); outline-offset:1px;}

.mode-toggle{
  display:flex;
  background:var(--navy-700);
  border:1px solid #263457;
  border-radius:9px;
  overflow:hidden;
  flex:0 0 auto;
}
.mode-toggle button{
  border:none;
  background:transparent;
  color:#9fb0d6;
  font-weight:700;
  font-size:13px;
  padding:8px 14px;
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.mode-toggle button.active{
  background:var(--blue-600);
  color:#fff;
}

/* ---------- Header / calendar controls ---------- */
.calheader{
  background:var(--navy-800);
  color:#fff;
  padding:12px 20px;
}
.calheader-title{
  text-align:center;
  font-family:var(--font-num);
  font-weight:800;
  font-size:clamp(14px, 2.6vw, 20px);
  letter-spacing:.4px;
  flex:1 1 auto;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.calheader-title .weekbadge{
  display:inline-block;
  margin-left:8px;
  font-size:11.5px;
  font-weight:600;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:2.5px 9px;
  border-radius:20px;
  vertical-align:middle;
  color:#c8d3ee;
  letter-spacing:0;
  white-space:nowrap;
}
.calheader-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.nav-group{
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
  flex:0 0 auto;
}
.icon-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#e7ecfc;
  width:36px;
  height:36px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:#1c2a4a;}
.icon-btn:active{transform:translateY(1px);}
.today-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#fff;
  height:36px;
  padding:0 16px;
  border-radius:9px;
  font-weight:600;
  font-size:13.5px;
}
.today-btn:hover{background:#1c2a4a;}
.view-toggle{
  display:flex;
  background:var(--navy-700);
  border:1px solid #263457;
  border-radius:9px;
  overflow:hidden;
  flex:0 0 auto;
}
.view-toggle button{
  border:none;
  background:transparent;
  color:#9fb0d6;
  font-weight:700;
  font-size:13.5px;
  padding:8px 18px;
  transition:background .15s,color .15s;
}
.view-toggle button.active{
  background:var(--blue-600);
  color:#fff;
}

/* Calendar popover */
.calendar-pop{
  position:absolute;
  top:44px;
  left:0;
  z-index:50;
  background:#fff;
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:0 12px 32px rgba(10,20,50,.28);
  width:300px;
  padding:14px;
  display:none;
}
.calendar-pop.open{display:block;}
.calendar-pop-tabs{
  display:flex;
  background:var(--grey-100);
  border-radius:8px;
  padding:3px;
  margin-bottom:12px;
}
.calendar-pop-tabs button{
  flex:1;
  border:none;
  background:transparent;
  padding:7px 0;
  font-size:12.5px;
  font-weight:700;
  border-radius:6px;
  color:var(--text-muted);
}
.calendar-pop-tabs button.active{
  background:#fff;
  color:var(--blue-600);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.cp-panel{display:none;}
.cp-panel.active{display:block;}
.cp-month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.cp-month-nav .label{font-weight:700; font-size:14px;}
.cp-month-nav button{
  background:var(--grey-100);
  border:none;
  width:26px;height:26px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.cp-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  text-align:center;
}
.cp-grid .dow{
  font-size:11px;
  color:var(--text-muted);
  font-weight:700;
  padding-bottom:4px;
}
.cp-day{
  font-size:12.5px;
  padding:6px 0;
  border-radius:6px;
  font-family:var(--font-num);
  color:var(--text);
  background:transparent;
  border:none;
}
.cp-day.out{color:#c8cedb;}
.cp-day.weekend{color:#c8cedb; cursor:default;}
.cp-day.school:hover{background:var(--blue-100); cursor:pointer;}
.cp-day.today{box-shadow:inset 0 0 0 1.5px var(--blue-600); font-weight:800;}
.cp-day.selected{background:var(--blue-600); color:#fff; font-weight:800;}
.cp-day.disabled{cursor:default; color:#dde1ea;}
.week-list{max-height:280px; overflow-y:auto;}
.week-item{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:12.5px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.week-item:hover{border-color:var(--blue-500); background:var(--blue-100);}
.week-item b{font-family:var(--font-num); color:var(--blue-600); font-size:13px;}
.week-item .range{color:var(--text-muted); font-size:11.5px; font-family:var(--font-num);}

/* ---------- Grid ---------- */
.grid-wrap{
  flex:1;
  overflow-x:auto;
  background:var(--card);
  padding:0 0 24px 0;
}
table.tt{
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  table-layout:fixed;
  min-width:640px;
}
table.tt th, table.tt td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
}
table.tt th:first-child, table.tt td:first-child{border-left:1px solid var(--border);}

.col-label{width:110px;}
body.day-view table.tt{min-width:0;}
body.day-view table.tt .col-label{width:96px;}
body.day-view th.daycol{min-width:0;}

th.corner{
  background:var(--grey-100);
  color:var(--text-muted);
  font-size:12px;
  font-weight:700;
  padding:10px 8px;
  border-top:1px solid var(--border);
  position:sticky; left:0; z-index:3;
}
th.daycol{
  background:#fff;
  color:var(--text);
  padding:10px 6px 12px;
  text-align:center;
  border-top:1px solid var(--border);
  min-width:120px;
}
th.daycol .wd{font-size:12.5px; font-weight:600; color:var(--text-muted);}
th.daycol .dnum{font-family:var(--font-num); font-size:22px; font-weight:800; line-height:1.25; margin:1px 0 4px; color:var(--text);}
th.daycol.is-today{background:var(--blue-600);}
th.daycol.is-today .wd{color:#cfdbfa;}
th.daycol.is-today .dnum{color:#fff;}
.badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:2.5px 9px;
  border-radius:20px;
  background:var(--blue-600);
  color:#fff;
}
th.daycol.is-today .badge{background:rgba(255,255,255,.92); color:var(--blue-600);}
.badge.unset{background:var(--grey-400); color:#fff;}
.badge.special-S{background:var(--amber-100); color:#8a5216;}
.badge.special-E{background:var(--red-100); color:#9c332c;}
.badge.special-TD{background:var(--violet-100); color:#5b3a8f;}

td.period-label{
  background:var(--grey-100);
  padding:9px 10px;
  font-size:12.5px;
  font-weight:700;
  color:var(--text);
  vertical-align:middle;
  position:sticky; left:0; z-index:2;
  line-height:1.5;
}
td.period-label .time{display:block; font-size:11px; font-weight:500; color:var(--text-muted); font-family:var(--font-num);}

tr.fixed-row td.cell{
  background:repeating-linear-gradient(135deg, #eef1f8, #eef1f8 6px, #e5e9f3 6px, #e5e9f3 12px);
}
tr.fixed-row td.period-label{background:var(--grey-100);}

td.cell{
  padding:8px 8px;
  vertical-align:middle;
  text-align:center;
  font-size:12.5px;
  height:52px;
  color:var(--text);
}
td.cell .subj{font-weight:700; display:block; margin-bottom:3px;}
td.cell .loc{display:block; font-size:11px; color:var(--text-muted);}
td.cell .loc-wrap{display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap;}
td.cell .room{font-size:10.5px; opacity:.75;}
td.cell .class-chip{
  display:inline-block;
  font-family:var(--font-num);
  font-size:11px;
  font-weight:800;
  opacity:.85;
}
td.cell .fixed-main{font-weight:700; display:block;}
td.cell .fixed-sub{display:block; font-size:11px; color:var(--text-muted); margin-top:2px;}
td.cell.empty{color:#d7dbe6;}
td.cell.empty::before{content:"—";}
td.cell.merged{font-weight:700; color:var(--text); letter-spacing:.5px;}

td.cell.clickable{cursor:pointer; transition:box-shadow .12s, transform .12s;}
td.cell.clickable:hover{box-shadow:inset 0 0 0 2px var(--blue-500); }
td.cell.clickable:active{transform:scale(0.98);}

/* ---------- Free-teacher modal ---------- */
.free-modal-backdrop{
  position:fixed; inset:0;
  background:rgba(10,16,32,.45);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.free-modal-backdrop.open{display:flex;}
.free-modal{
  background:#fff;
  color:var(--text);
  border-radius:14px;
  width:min(92vw, 380px);
  max-height:80vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 20px 60px rgba(10,20,50,.35);
}
.free-modal-header{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--grey-100);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.free-modal-title{font-weight:800; font-size:15px; line-height:1.4;}
.free-modal-title .sub{display:block; font-weight:600; font-size:12px; color:var(--text-muted); margin-top:2px;}
.free-modal-close{
  background:var(--grey-100);
  border:none;
  width:28px; height:28px;
  border-radius:8px;
  flex:0 0 auto;
  color:var(--text-muted);
  font-size:16px;
  line-height:1;
  cursor:pointer;
}
.free-modal-body{
  padding:14px 18px 18px;
  overflow-y:auto;
}
.free-modal-count{
  font-size:12.5px;
  color:var(--text-muted);
  margin-bottom:10px;
  font-weight:600;
}
.free-teacher-grid{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.free-teacher-chip{
  background:var(--blue-100);
  color:var(--blue-600);
  font-size:12.5px;
  font-weight:700;
  padding:6px 12px;
  border-radius:20px;
}
.free-modal-empty{
  color:var(--text-muted);
  font-size:13px;
  padding:8px 0;
  text-align:center;
}

/* ---------- Duty (值日) cells ---------- */
td.cell.duty-cell{
  background:#fff4e0 !important;
  color:#8a5216;
}
tr.fixed-row td.cell.duty-cell{background:#fff4e0 !important;}
td.cell.duty-cell .duty-tag{
  display:inline-block;
  font-size:10.5px;
  font-weight:800;
  background:var(--amber-500);
  color:#fff;
  padding:1.5px 8px;
  border-radius:20px;
  margin-bottom:3px;
  letter-spacing:.3px;
}
td.cell.duty-cell .duty-loc{display:block; font-weight:700; font-size:12px;}
tr.duty-row td.period-label{background:#fbf3e8;}
tr.duty-row td.cell.empty{color:#d7dbe6;}

td.cell.no-data-msg{
  text-align:center;
  color:var(--text-muted);
  font-weight:600;
  height:90px;
  font-size:13.5px;
}
td.cell.no-data-msg::before{content:none;}

/* ---------- Responsive breakpoints (RWD: phone / tablet / desktop) ---------- */
@media (max-width:1024px){
  .app{max-width:100%;}
  .topbar{padding:12px 16px;}
  select#entitySelect{min-width:120px; font-size:13px;}
  .mode-toggle button{padding:7px 10px; font-size:12px;}
}

@media (max-width:768px){
  .topbar{padding:10px 12px; gap:10px;}
  .topbar-right{gap:10px; width:100%;}
  .entity-select-wrap{flex:1 1 auto;}
  select#entitySelect{width:100%; min-width:0;}
  .mode-toggle{width:100%;}
  .mode-toggle button{flex:1;}
  .school-name{font-size:13px;}
  .school-name .sub{display:none;}
  .calheader{padding:8px 12px;}
  .calheader-controls{gap:6px;}
  .nav-group{gap:4px;}
  .icon-btn{width:32px; height:32px;}
  .today-btn{padding:0 10px; font-size:12.5px; height:32px;}
  .view-toggle button{padding:6px 12px; font-size:12.5px;}
  .grid-wrap{padding-bottom:16px;}

  /* Shrink the period-label column and day columns so week view shows
     more days on a phone screen instead of being dominated by the label. */
  table.tt{min-width:0;}
  .col-label{width:60px;}
  th.corner{padding:8px 4px; font-size:10.5px;}
  td.period-label{padding:6px 4px; font-size:10.5px;}
  td.period-label .time{font-size:9px;}
  th.daycol{min-width:84px; padding:8px 3px 10px;}
  th.daycol .wd{font-size:11px;}
  th.daycol .dnum{font-size:17px; margin:1px 0 3px;}
  .badge{font-size:9.5px; padding:2px 6px;}

  td.cell{font-size:10.5px; height:46px; padding:6px 4px;}
  td.cell .subj{font-size:11px;}
  td.cell .room{font-size:9.5px;}
  td.cell .class-chip{font-size:9.5px; padding:1px 5px;}
  td.cell.duty-cell .duty-tag{font-size:9px; padding:1px 6px;}
  td.cell.duty-cell .duty-loc{font-size:10.5px;}

  .calendar-pop{width:min(90vw, 300px); left:0; right:auto;}
  .cp-day{font-size:11.5px; padding:5px 0;}
}

@media (max-width:480px){
  .calheader-title .weekbadge{display:none;}
}

@media (max-width:420px){
  .school-name{font-size:12px;}
  .today-btn{padding:0 8px; font-size:12px;}
  .icon-btn{width:28px; height:28px;}
  .view-toggle button{padding:6px 10px; font-size:12px;}
  .calheader-controls{gap:4px;}
  .calheader-title{font-size:12.5px;}

  .col-label{width:52px;}
  th.corner{font-size:10px;}
  td.period-label{font-size:10px;}
  th.daycol{min-width:74px; padding:7px 2px 9px;}
  th.daycol .dnum{font-size:15px;}

  td.cell{font-size:10px; height:44px; padding:5px 3px;}
  td.cell .subj{font-size:10.5px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="school-name">樂華天主教小學<span class="sub" id="modeSubtitle">教師個人時間表</span></div>
    <div class="topbar-right">
      <div class="mode-toggle" id="modeToggle">
        <button class="active" data-mode="teacher">教師</button>
        <button data-mode="class">班別</button>
        <button data-mode="room">特別室</button>
      </div>
      <div class="entity-select-wrap">
        <label for="entitySelect" id="entityLabel">教師</label>
        <select id="entitySelect"></select>
      </div>
    </div>
  </div>

  <div class="calheader">
    <div class="calheader-controls">
      <div class="nav-group">
        <button class="icon-btn" id="prevBtn" aria-label="上一頁" title="上一頁">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">今日</button>
        <button class="icon-btn" id="calBtn" aria-label="選擇日期" title="選擇日期">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="下一頁" title="下一頁">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="calendar-pop" id="calPop">
          <div class="calendar-pop-tabs">
            <button class="active" id="tabDate" data-tab="date">按日期</button>
            <button id="tabWeek" data-tab="week">按循環週</button>
          </div>
          <div class="cp-panel active" id="panelDate">
            <div class="cp-month-nav">
              <button id="cpPrevMonth">‹</button>
              <span class="label" id="cpMonthLabel"></span>
              <button id="cpNextMonth">›</button>
            </div>
            <div class="cp-grid" id="cpGrid"></div>
          </div>
          <div class="cp-panel" id="panelWeek">
            <div class="week-list" id="weekList"></div>
          </div>
        </div>
      </div>
      <div class="calheader-title" id="calTitle"></div>
      <div class="view-toggle">
        <button id="viewWeekBtn" data-view="week">週</button>
        <button id="viewDayBtn" data-view="day">日</button>
      </div>
    </div>
  </div>

  <div class="grid-wrap">
    <table class="tt" id="ttTable"></table>
  </div>
</div>

<div class="free-modal-backdrop" id="freeModalBackdrop">
  <div class="free-modal">
    <div class="free-modal-header">
      <div class="free-modal-title" id="freeModalTitle"></div>

<script>
// ====== Timetable App Logic ======
(function(){
  "use strict";

  const DATA = APPDATA;
  const TEACHERS = DATA.teachers;
  const CLASSES = DATA.classes || [];
  const ROOMS = DATA.specialRooms || [];
  const DAY_MAP = DATA.dayMap;
  const CYCLE_WEEK = DATA.cycleWeek;
  const SPECIAL_DAYS = DATA.specialDays;
  const SPECIAL_LABELS = DATA.specialLabels;
  const WEEKS = DATA.weeks;
  const DUTY_INDEX = DATA.dutyIndex || {};

  const WEEKDAY_NAMES = ['','星期一','星期二','星期三','星期四','星期五'];
  const WEEKDAY_KEYS  = ['','Mon','Tue','Wed','Thu','Fri'];
  const MONTH_ZH = n => n + '月';

  const MODE_LABELS = {teacher:'教師', class:'班別', room:'特別室'};
  const MODE_SUBTITLES = {teacher:'教師個人時間表', class:'班別上課時間表', room:'特別室時間表'};
  const MODE_LISTS = {teacher: TEACHERS, class: CLASSES, room: ROOMS};

  // Row definitions in display order.
  // dutyRow  = pure duty slot (no lesson fallback, just duty-or-blank) -- teacher view only
  // dutySlot = a break/fixed slot that shows duty when assigned, else its generic label -- teacher view only
  // merged   = single label spanning the week (uniform every school day, e.g. homeroom)
  // idx / weekdayBased = real lesson-period cell
  const ROWS_TEACHER = [
    {key:'dutyA',         label:'課前值日',   time:'07:30-07:45', dutyRow:true, dutySlot:'morningA'},
    {key:'dutyB',         label:'課前值日',   time:'07:45-08:00', dutyRow:true, dutySlot:'morningB'},
    {key:'earlyExercise', label:'早操',     time:'07:55-08:00', fixed:true, merged:true},
    {key:'assembly',      label:'早會',     time:'08:00-08:10', fixed:true},
    {key:'homeroom',      label:'班主任課', time:'08:10-08:25', fixed:true, merged:true},
    {key:'period0',       label:'第1節',    time:'08:25-09:00', idx:0},
    {key:'period1',       label:'第2節',    time:'09:00-09:35', idx:1},
    {key:'period2',       label:'第3節',    time:'09:35-10:10', idx:2},
    {key:'break1',        label:'小息一',   time:'10:10-10:25', fixed:true, dutySlot:'recess1'},
    {key:'period3',       label:'第4節',    time:'10:25-11:00', idx:3},
    {key:'period4',       label:'第5節',    time:'11:00-11:35', idx:4},
    {key:'break2',        label:'小息二',   time:'11:35-11:50', fixed:true, dutySlot:'recess2'},
    {key:'period5',       label:'第6節',    time:'11:50-12:25', idx:5},
    {key:'period6',       label:'第7節',    time:'12:25-13:00', idx:6},
    {key:'lunch',         label:'午膳',     time:'13:00-13:30', fixed:true, dutySlot:'lunch'},
    {key:'break3',        label:'小息三',   time:'13:30-14:00', fixed:true, dutySlot:'recess3'},
    {key:'period7',       label:'第8節',    time:'14:00-14:35', idx:7},
    {key:'period9',       label:'第9節',    time:'14:35-15:20', weekdayBased:true},
  ];
  // Class / room views: no duty data, so breaks & lunch are plain fixed rows.
  const ROWS_PLAIN = [
    {key:'earlyExercise', label:'早操',     time:'07:55-08:00', fixed:true, merged:true},
    {key:'assembly',      label:'早會',     time:'08:00-08:10', fixed:true},
    {key:'homeroom',      label:'班主任課', time:'08:10-08:25', fixed:true, merged:true},
    {key:'period0',       label:'第1節',    time:'08:25-09:00', idx:0},
    {key:'period1',       label:'第2節',    time:'09:00-09:35', idx:1},
    {key:'period2',       label:'第3節',    time:'09:35-10:10', idx:2},
    {key:'break1',        label:'小息一',   time:'10:10-10:25', fixed:true, merged:true},
    {key:'period3',       label:'第4節',    time:'10:25-11:00', idx:3},
    {key:'period4',       label:'第5節',    time:'11:00-11:35', idx:4},
    {key:'break2',        label:'小息二',   time:'11:35-11:50', fixed:true, merged:true},
    {key:'period5',       label:'第6節',    time:'11:50-12:25', idx:5},
    {key:'period6',       label:'第7節',    time:'12:25-13:00', idx:6},
    {key:'lunch',         label:'午膳',     time:'13:00-13:30', fixed:true, merged:true},
    {key:'break3',        label:'小息三',   time:'13:30-14:00', fixed:true, merged:true},
    {key:'period7',       label:'第8節',    time:'14:00-14:35', idx:7},
    {key:'period9',       label:'第9節',    time:'14:35-15:20', weekdayBased:true},
  ];
  function activeRows(){ return state.mode === 'teacher' ? ROWS_TEACHER : ROWS_PLAIN; }

  // ---------- date helpers ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function toKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ // Monday
    const r = new Date(d);
    const dow = r.getDay(); // 0 Sun .. 6 Sat
    const diff = (dow === 0) ? -6 : (1 - dow);
    r.setDate(r.getDate() + diff);
    r.setHours(0,0,0,0);
    return r;
  }
  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function weekdayIdx(d){ const dow = d.getDay(); return (dow>=1 && dow<=5) ? dow : null; } // 1..5 = Mon..Fri

  function dayInfo(key){
    const v = DAY_MAP[key];
    if(!v) return {type:'unset'};
    if(v.indexOf('Day') === 0) return {type:'schoolday', day:v};
    return {type:'special', code:v, detail: SPECIAL_DAYS[key]};
  }
  function cycleParity(key){
    const wk = CYCLE_WEEK[key];
    if(!wk) return null;
    return {week:wk, parity: (wk % 2 === 1) ? 'odd' : 'even'};
  }

  // ---------- duty lookup ----------
  function bareName(name){
    let s = String(name || '').trim();
    // Strip a trailing parenthetical, e.g. "許碧玉老師  (1A班主任)" -> "許碧玉老師"
    s = s.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
    // Strip trailing role/title words, e.g. "老師" / "主任" / "副校長"
    s = s.replace(/(副校長|校長|副主任|主任|老師)+$/, '').trim();
    return s;
  }
  function getDuty(teacher, dayKey, slot){
    const entries = (DUTY_INDEX[bareName(teacher.name)] || {})[dayKey];
    if(!entries) return null;
    return entries.find(e => e.slot === slot) || null;
  }

  // ---------- class + subject colour coding (full cell fill) ----------
  function splitLocation(loc){
    if(!loc) return {room:'', code:null};
    const m = loc.match(/([1-6])\s*([A-Za-z])(?![A-Za-z])/);
    if(!m) return {room: loc.trim(), code:null};
    const code = (m[1] + m[2]).toUpperCase();
    const room = (loc.slice(0, m.index) + loc.slice(m.index + m[0].length)).trim();
    return {room, code};
  }
  function goldenPalette(keys){
    const map = {};
    // Full hue spectrum (golden-angle spacing) for maximum variety between
    // keys, tuned for a vivid-but-readable pastel look: saturated enough
    // to feel colourful, lightness kept high enough for dark text to read.
    keys.forEach((k, i) => {
      const hue = Math.round((i * 137.508) % 360);
      const light = 82 - (i % 3) * 4;                 // 82 / 78 / 74
      const sat = 68 + (i % 4) * 8;                    // 68 / 76 / 84 / 92
      map[k] = 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
    });
    return map;
  }
  const COMBO_PALETTE = (function(){
    const set = new Set();
    TEACHERS.forEach(t => {
      t.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => {
            const {code} = splitLocation(e.location || '');
            if(code) set.add(code + '::' + e.subject);
          });
        });
      });
    });
    ROOMS.forEach(r => {
      r.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => {
            if(e.classCode) set.add(e.classCode + '::' + e.subject);
          });
        });
      });
    });
    return goldenPalette(Array.from(set).sort());
  })();
  const SUBJECT_PALETTE = (function(){
    const set = new Set();
    CLASSES.forEach(c => {
      c.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => { if(e.subject) set.add(e.subject); });
        });
      });
    });
    return goldenPalette(Array.from(set).sort());
  })();
  function comboColor(code, subject){
    const key = code + '::' + subject;
    if(COMBO_PALETTE[key]) return COMBO_PALETTE[key];
    let hash = 0;
    for(let i=0;i<key.length;i++){ hash = key.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
    const hue = Math.abs(hash) % 360;
    return 'hsl(' + hue + ',72%,80%)';
  }
  function subjectColor(subject){
    if(SUBJECT_PALETTE[subject]) return SUBJECT_PALETTE[subject];
    let hash = 0;
    for(let i=0;i<subject.length;i++){ hash = subject.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
    const hue = Math.abs(hash) % 360;
    return 'hsl(' + hue + ',72%,80%)';
  }

  // ---------- state ----------
  const state = {
    date: new Date(),
    view: (window.matchMedia('(max-width: 768px)').matches) ? 'day' : 'week',
    mode: 'teacher',
    entityIdx: {teacher: 0, class: 0, room: 0},
    calOpen: false,
    calTab: 'date',
    calMonthCursor: new Date()
  };
  state.date.setHours(0,0,0,0);

  // Picks the entry matching the current cycle-week parity from a byDay entry
  // list. An entry with parity:null applies every week; otherwise it must
  // match the current week's odd/even parity.
  function pickEntry(list, dateKey){
    if(!list || !list.length) return null;
    const par = cycleParity(dateKey);
    const match = list.find(e => !e.parity || (par && e.parity === par.parity));
    return match || null;
  }

  // Returns the list of teacher names with no lesson scheduled at the given
  // calendar date + lesson-period index (0-based, matching ROWS' `idx`).
  // Returns null if the date isn't a normal school day (holiday/unset/special).
  function freeTeachersAt(dateKey, periodIdx){
    const info = dayInfo(dateKey);
    if(info.type !== 'schoolday') return null;
    const dayKey = info.day;
    const free = [];
    TEACHERS.forEach(t => {
      const period = t.periods[periodIdx];
      const list = period ? period.byDay[dayKey] : null;
      const e = pickEntry(list, dateKey);
      if(!e) free.push(t.name);
    });
    return free;
  }

  // Returns the list of teacher names with no duty assigned at the given
  // calendar date + duty slot key (morningA/morningB/recess1/recess2/recess3/lunch).
  function freeTeachersForSlot(dateKey, slotKey){
    const info = dayInfo(dateKey);
    if(info.type !== 'schoolday') return null;
    const dayKey = info.day;
    const free = [];
    TEACHERS.forEach(t => {
      if(!getDuty(t, dayKey, slotKey)) free.push(t.name);
    });
    return free;
  }

  // ---------- lesson-period cell content ----------
  function getCellContent(entity, rowDef, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);

    if(!wIdx){ return {state:'unset'}; }
    if(info.type === 'unset'){ return {state:'unset'}; }
    if(info.type === 'special'){ return {state:'special', code: info.code}; }

    const wd = WEEKDAY_KEYS[wIdx];

    if(rowDef.key === 'earlyExercise'){
      return entity.earlyExercise ? {state:'filled', main: entity.earlyExercise} : {state:'empty'};
    }
    if(rowDef.key === 'assembly'){
      const main = (entity.assemblyMain || {})[wd] || '';
      const sub = (entity.assemblySub || {})[wd] || '';
      if(!main && !sub) return {state:'empty'};
      return {state:'filled', main:main, sub:sub};
    }
    if(rowDef.key === 'homeroom'){
      return entity.homeroom ? {state:'filled', main: entity.homeroom} : {state:'empty'};
    }
    if(rowDef.weekdayBased){
      const e = (entity.period9 || {})[wd];
      return e ? {state:'filled', main:e.subject} : {state:'empty'};
    }
    if(rowDef.idx !== undefined){
      const dayKey = info.day; // Day1..Day6
      const period = entity.periods[rowDef.idx];
      const list = period.byDay[dayKey];
      const e = pickEntry(list, key);
      if(!e) return {state:'empty'};
      return {state:'filled', entry: e};
    }
    return {state:'empty'};
  }

  // ---------- rendering ----------
  function currentEntity(){ return MODE_LISTS[state.mode][state.entityIdx[state.mode]]; }

  function entityLabel(mode, e){
    if(mode === 'room') return e.name;
    return e.name;
  }
  function populateEntitySelect(){
    const sel = document.getElementById('entitySelect');
    const list = MODE_LISTS[state.mode];
    sel.innerHTML = '';
    list.forEach((e, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = entityLabel(state.mode, e);
      sel.appendChild(opt);
    });
    sel.value = state.entityIdx[state.mode];
  }
  function setMode(mode){
    if(state.mode === mode) return;
    state.mode = mode;
    document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('entityLabel').textContent = MODE_LABELS[mode];
    document.getElementById('modeSubtitle').textContent = MODE_SUBTITLES[mode];
    populateEntitySelect();
    renderAll();
  }

  function renderTitle(){
    const el = document.getElementById('calTitle');
    let refDate;
    if(state.view === 'week'){
      const mon = startOfWeek(state.date);
      refDate = addDays(mon, 2); // Wednesday represents the week's month
    } else {
      refDate = state.date;
    }
    let html = refDate.getFullYear() + '年' + MONTH_ZH(refDate.getMonth()+1);
    const par = cycleParity(toKey(refDate));
    if(par){
      html += '<span class="weekbadge">第 ' + par.week + ' 循環週 · ' + (par.parity==='odd' ? '單週' : '雙週') + '</span>';
    }
    el.innerHTML = html;
  }

  function badgeHtml(info){
    if(info.type === 'schoolday'){
      return '<span class="badge">' + info.day.replace('Day','Day ') + '</span>';
    }
    if(info.type === 'special'){
      return '<span class="badge special-' + info.code + '">DAY ' + info.code + '</span>';
    }
    return '<span class="badge unset">未設定</span>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Pure duty-slot cell (dutyA / dutyB rows): duty-or-blank, day-indexed. Teacher view only.
  function dutyOnlyCellHtml(teacher, dutySlot, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);
    if(!wIdx || info.type !== 'schoolday') return '<td class="cell empty"></td>';
    const attrs = ' data-duty-slot="' + dutySlot + '" data-date-key="' + key + '"';
    const d = getDuty(teacher, info.day, dutySlot);
    if(d){
      return '<td class="cell duty-cell clickable"' + attrs + '><span class="duty-tag">值日</span><span class="duty-loc">' + escapeHtml(d.location) + '</span></td>';
    }
    return '<td class="cell empty clickable"' + attrs + '></td>';
  }

  // Break/fixed cell that shows duty when assigned, else its generic label. Teacher view only.
  function breakCellHtml(teacher, rowDef, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);
    if(!wIdx || info.type !== 'schoolday') return '<td class="cell empty"></td>';
    const attrs = ' data-duty-slot="' + rowDef.dutySlot + '" data-date-key="' + key + '"';
    const d = getDuty(teacher, info.day, rowDef.dutySlot);
    if(d){
      return '<td class="cell duty-cell clickable"' + attrs + '><span class="duty-tag">值日</span><span class="duty-loc">' + escapeHtml(d.location) + '</span></td>';
    }
    return '<td class="cell merged clickable"' + attrs + '>' + escapeHtml(rowDef.label) + '</td>';
  }

  // Renders one lesson-period entry, styled differently per view:
  //  - teacher entries carry `location` (room + optional class code) -- unchanged look
  //  - room entries carry `classCode` -- badge shows the visiting class
  //  - class entries carry `teacher` only -- coloured by subject
  // meta (optional): {periodIdx, dateKey} -- makes the cell clickable to show free teachers.
  function entryCellHtml(entry, meta){
    let cellStyle = '';
    let html = '<span class="subj">' + escapeHtml(entry.subject) + '</span>';
    if(entry.classCode !== undefined && entry.classCode !== null){
      const bg = comboColor(entry.classCode, entry.subject);
      cellStyle = 'background:' + bg + ';';
      html += '<span class="loc-wrap"><span class="class-chip">' + escapeHtml(entry.classCode) + '</span>';
      if(entry.teacher) html += '<span class="room">' + escapeHtml(entry.teacher) + '</span>';
      html += '</span>';
    } else if(entry.location !== undefined){
      if(entry.location){
        const parsed = splitLocation(entry.location);
        html += '<span class="loc-wrap">';
        if(parsed.room) html += '<span class="room">' + escapeHtml(parsed.room) + '</span>';
        if(parsed.code){
          const bg = comboColor(parsed.code, entry.subject);
          cellStyle = 'background:' + bg + ';';
          html += '<span class="class-chip">' + parsed.code + '</span>';
        }
        html += '</span>';
      }
    } else if(entry.teacher){
      const bg = subjectColor(entry.subject);
      cellStyle = 'background:' + bg + ';';
      html += '<span class="loc-wrap"><span class="room">' + escapeHtml(entry.teacher) + '</span></span>';
    }
    const cls = 'cell' + (meta ? ' clickable' : '');
    const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
    return '<td class="' + cls + '"' + attrs + (cellStyle ? ' style="' + cellStyle + '"' : '') + '>' + html + '</td>';
  }

  // Regular lesson-period / fixed-text cell.
  // meta (optional): {periodIdx, dateKey} -- makes the cell clickable to show free teachers.
  function cellHtml(content, meta){
    if(content.state === 'unset' || content.state === 'special'){
      return '<td class="cell empty"></td>';
    }
    if(content.state === 'empty'){
      const cls = 'cell empty' + (meta ? ' clickable' : '');
      const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
      return '<td class="' + cls + '"' + attrs + '></td>';
    }
    if(content.entry){
      return entryCellHtml(content.entry, meta);
    }
    let html = '<span class="subj">' + escapeHtml(content.main) + '</span>';
    if(content.sub){
      html += '<span class="loc-wrap"><span class="room">' + escapeHtml(content.sub) + '</span></span>';
    }
    const cls = 'cell' + (meta ? ' clickable' : '');
    const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
    return '<td class="' + cls + '"' + attrs + '>' + html + '</td>';
  }

  function renderWeek(){
    const table = document.getElementById('ttTable');
    const entity = currentEntity();
    const rows = activeRows();
    const mon = startOfWeek(state.date);
    const days = [1,2,3,4,5].map(i => addDays(mon, i-1));
    const today = new Date(); today.setHours(0,0,0,0);

    let thead = '<thead><tr><th class="corner col-label">節數</th>';
    days.forEach((d, i) => {
      const key = toKey(d);
      const info = dayInfo(key);
      const isToday = sameDate(d, today);
      thead += '<th class="daycol' + (isToday?' is-today':'') + '">' +
        '<div class="wd">' + WEEKDAY_NAMES[i+1] + '</div>' +
        '<div class="dnum">' + d.getDate() + '</div>' +
        badgeHtml(info) +
        '</th>';
    });
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    rows.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      const dutyRowClass = (rowDef.dutyRow || rowDef.dutySlot) ? ' duty-row' : '';
      tbody += '<tr class="' + rowClass + dutyRowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';

      if(rowDef.dutyRow){
        days.forEach(d => {
          tbody += dutyOnlyCellHtml(entity, rowDef.dutySlot, d);
        });
      } else if(rowDef.merged){
        let anySchool = days.some(d => { const t = dayInfo(toKey(d)).type; return t !== 'unset' && t !== 'special'; });
        if(!anySchool){
          tbody += '<td class="cell empty" colspan="5"></td>';
        } else {
          const sample = getCellContent(entity, rowDef, days.find(d => dayInfo(toKey(d)).type === 'schoolday') || days[0]);
          const text = (sample.state === 'filled') ? sample.main : rowDef.label;
          tbody += '<td class="cell merged" colspan="5">' + escapeHtml(text) + '</td>';
        }
      } else if(rowDef.dutySlot){
        days.forEach(d => {
          tbody += breakCellHtml(entity, rowDef, d);
        });
      } else {
        days.forEach(d => {
          const content = getCellContent(entity, rowDef, d);
          const meta = (rowDef.idx !== undefined) ? {periodIdx: rowDef.idx, dateKey: toKey(d)} : null;
          tbody += cellHtml(content, meta);
        });
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';

    table.innerHTML = thead + tbody;
  }

  function DOW_toFull(dow){ return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dow]; }

  function renderDay(){
    const table = document.getElementById('ttTable');
    const entity = currentEntity();
    const rows = activeRows();
    const d = state.date;
    const key = toKey(d);
    const info = dayInfo(key);
    const wIdx = weekdayIdx(d);
    const today = new Date(); today.setHours(0,0,0,0);
    const isToday = sameDate(d, today);

    const headerBadge = badgeHtml(wIdx ? info : {type:'unset'});
    let thead = '<thead><tr><th class="corner col-label">節數</th>' +
      '<th class="daycol' + (isToday?' is-today':'') + '">' +
      '<div class="wd">' + (wIdx ? WEEKDAY_NAMES[wIdx] : DOW_toFull(d.getDay())) + '</div>' +
      '<div class="dnum">' + d.getDate() + ' 日</div>' +
      headerBadge +
      '</th></tr></thead>';
    let tbody = '<tbody>';

    if(!wIdx || info.type === 'special' || info.type === 'unset'){
      let msg;
      if(!wIdx) msg = '週末，沒有課堂安排。';
      else if(info.type === 'special') msg = 'DAY ' + info.code + ' · ' + (SPECIAL_LABELS[info.code] || info.code) + '，沒有指定課節資料。';
      else msg = '此日期尚未設定循環日資料。';
      tbody += '<tr><td class="cell empty no-data-msg" colspan="2">' + escapeHtml(msg) + '</td></tr>';
      tbody += '</tbody>';
      table.innerHTML = thead + tbody;
      return;
    }

    rows.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      const dutyRowClass = (rowDef.dutyRow || rowDef.dutySlot) ? ' duty-row' : '';
      tbody += '<tr class="' + rowClass + dutyRowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';

      if(rowDef.dutyRow){
        tbody += dutyOnlyCellHtml(entity, rowDef.dutySlot, d);
      } else if(rowDef.merged){
        const content = getCellContent(entity, rowDef, d);
        const text = (content.state === 'filled') ? content.main : rowDef.label;
        tbody += '<td class="cell merged">' + escapeHtml(text) + '</td>';
      } else if(rowDef.dutySlot){
        tbody += breakCellHtml(entity, rowDef, d);
      } else {
        const content = getCellContent(entity, rowDef, d);
        const meta = (rowDef.idx !== undefined) ? {periodIdx: rowDef.idx, dateKey: toKey(d)} : null;
        tbody += cellHtml(content, meta);
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
  }

  function renderGrid(){
    if(state.view === 'week') renderWeek(); else renderDay();
  }

  function renderViewToggle(){
    document.getElementById('viewWeekBtn').classList.toggle('active', state.view === 'week');
    document.getElementById('viewDayBtn').classList.toggle('active', state.view === 'day');
    document.body.classList.toggle('day-view', state.view === 'day');
  }

  function renderAll(){
    renderTitle();
    renderViewToggle();
    renderGrid();
    if(state.calOpen) renderCalendarPopover();
  }

  // ---------- calendar popover ----------
  function renderCalendarPopover(){
    document.getElementById('tabDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('tabWeek').classList.toggle('active', state.calTab==='week');
    document.getElementById('panelDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('panelWeek').classList.toggle('active', state.calTab==='week');

    if(state.calTab === 'date'){
      renderMonthGrid();
    } else {
      renderWeekList();
    }
  }

  function renderMonthGrid(){
    const cursor = state.calMonthCursor;
    const y = cursor.getFullYear(), m = cursor.getMonth();
    document.getElementById('cpMonthLabel').textContent = y + '年' + MONTH_ZH(m+1);
    const grid = document.getElementById('cpGrid');
    let html = '';
    ['一','二','三','四','五','六','日'].forEach(l => html += '<div class="dow">' + l + '</div>');

    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() === 0) ? 6 : first.getDay()-1; // Monday-first
    const gridStart = addDays(first, -startOffset);
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<42;i++){
      const d = addDays(gridStart, i);
      const key = toKey(d);
      const inMonth = d.getMonth() === m;
      const isWeekend = !weekdayIdx(d);
      const info = dayInfo(key);
      const isSchool = !isWeekend && (info.type !== 'unset');
      const classes = ['cp-day'];
      if(!inMonth) classes.push('out');
      if(isWeekend) classes.push('weekend');
      if(isSchool) classes.push('school'); else if(inMonth && !isWeekend) classes.push('disabled');
      if(sameDate(d, today)) classes.push('today');
      if(sameDate(d, state.date)) classes.push('selected');
      html += '<button type="button" class="' + classes.join(' ') + '" data-key="' + key + '">' + d.getDate() + '</button>';
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cp-day').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.key);
        closeCalendar();
        renderAll();
      });
    });
  }

  function renderWeekList(){
    const host = document.getElementById('weekList');
    let html = '';
    WEEKS.forEach(w => {
      html += '<button type="button" class="week-item" data-date="' + w.firstDate + '">' +
        '<b>第 ' + w.week + ' 循環週 · ' + (w.week % 2 === 1 ? '單週' : '雙週') + '</b>' +
        '<span class="range">' + w.label + '</span>' +
        '</button>';
    });
    host.innerHTML = html;
    host.querySelectorAll('.week-item').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.date);
        state.calMonthCursor = new Date(state.date);
        closeCalendar();
        renderAll();
      });
    });
  }

  function openCalendar(){
    state.calOpen = true;
    state.calMonthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    document.getElementById('calPop').classList.add('open');
    renderCalendarPopover();
  }
  function closeCalendar(){
    state.calOpen = false;
    document.getElementById('calPop').classList.remove('open');
  }

  // ---------- navigation ----------
  function goPrev(){
    state.date = addDays(state.date, state.view === 'week' ? -7 : -1);
    renderAll();
  }
  function goNext(){
    state.date = addDays(state.date, state.view === 'week' ? 7 : 1);
    renderAll();
  }
  function goToday(){
    state.date = new Date(); state.date.setHours(0,0,0,0);
    renderAll();
  }
  function setView(v){
    state.view = v;
    renderAll();
  }

  // ---------- free-teacher modal ----------
  const PERIOD_ROW_BY_IDX = {};
  const SLOT_ROW_BY_KEY = {};
  ROWS_TEACHER.forEach(r => {
    if(r.idx !== undefined) PERIOD_ROW_BY_IDX[r.idx] = r;
    if(r.dutySlot) SLOT_ROW_BY_KEY[r.dutySlot] = r;
  });

  // opts: {kind:'period', idx} for lesson periods, or {kind:'duty', slot} for
  // 課前值日／小息一二三／午膳 rows.
  function openFreeModal(dateKey, opts){
    let rowDef, free, isDuty;
    if(opts.kind === 'duty'){
      rowDef = SLOT_ROW_BY_KEY[opts.slot];
      free = freeTeachersForSlot(dateKey, opts.slot);
      isDuty = true;
    } else {
      rowDef = PERIOD_ROW_BY_IDX[opts.idx];
      free = freeTeachersAt(dateKey, opts.idx);
      isDuty = false;
    }
    const d = fromKey(dateKey);
    const info = dayInfo(dateKey);
    const dateLabel = (d.getMonth()+1) + '月' + d.getDate() + '日（' + DOW_toFull(d.getDay()) + '）';
    const dayBadge = (info.type === 'schoolday') ? info.day.replace('Day','Day ') : '';
    const titleSuffix = isDuty ? ' 沒有值日的老師' : ' 空堂老師';

    document.getElementById('freeModalTitle').innerHTML =
      escapeHtml((rowDef ? rowDef.label : '') + titleSuffix) +
      '<span class="sub">' + escapeHtml(dateLabel + (dayBadge ? '　' + dayBadge : '') + (rowDef ? '　' + rowDef.time : '')) + '</span>';

    const countEl = document.getElementById('freeModalCount');
    const gridEl = document.getElementById('freeModalGrid');

    if(free === null){
      countEl.textContent = '';
      gridEl.innerHTML = '<div class="free-modal-empty">當日並非恆常上課日，沒有相關資料。</div>';
    } else if(free.length === 0){
      countEl.textContent = isDuty ? '所有教師這節皆有值日安排。' : '所有教師這節皆有課節。';
      gridEl.innerHTML = '';
    } else {
      countEl.textContent = isDuty ? ('共 ' + free.length + ' 位老師這節沒有值日：') : ('共 ' + free.length + ' 位老師這節空堂：');
      gridEl.innerHTML = free.map(name => '<span class="free-teacher-chip">' + escapeHtml(name.replace(/\s+/g, ' ').trim()) + '</span>').join('');
    }

    document.getElementById('freeModalBackdrop').classList.add('open');
  }
  function closeFreeModal(){
    document.getElementById('freeModalBackdrop').classList.remove('open');
  }

  // ---------- init ----------
  function init(){
    populateEntitySelect();
    renderAll();

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('nextBtn').addEventListener('click', goNext);
    document.getElementById('todayBtn').addEventListener('click', goToday);
    document.getElementById('viewWeekBtn').addEventListener('click', () => setView('week'));
    document.getElementById('viewDayBtn').addEventListener('click', () => setView('day'));

    document.querySelectorAll('#modeToggle button').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    document.getElementById('entitySelect').addEventListener('change', (e) => {
      state.entityIdx[state.mode] = Number(e.target.value);
      renderAll();
    });

    document.getElementById('calBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if(state.calOpen) closeCalendar(); else openCalendar();
    });
    document.getElementById('calPop').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => { if(state.calOpen) closeCalendar(); });

    document.getElementById('tabDate').addEventListener('click', () => { state.calTab='date'; renderCalendarPopover(); });
    document.getElementById('tabWeek').addEventListener('click', () => { state.calTab='week'; renderCalendarPopover(); });

    document.getElementById('cpPrevMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()-1, 1);
      renderMonthGrid();
    });
    document.getElementById('cpNextMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()+1, 1);
      renderMonthGrid();
    });

    document.getElementById('ttTable').addEventListener('click', (e) => {
      const cell = e.target.closest('td.cell.clickable');
      if(!cell) return;
      const dateKey = cell.dataset.dateKey;
      if(!dateKey) return;
      if(cell.dataset.dutySlot){
        openFreeModal(dateKey, {kind:'duty', slot: cell.dataset.dutySlot});
      } else if(cell.dataset.periodIdx !== undefined && cell.dataset.periodIdx !== ''){
        openFreeModal(dateKey, {kind:'period', idx: Number(cell.dataset.periodIdx)});
      }
    });
    document.getElementById('freeModalClose').addEventListener('click', closeFreeModal);
    document.getElementById('freeModalBackdrop').addEventListener('click', (e) => {
      if(e.target.id === 'freeModalBackdrop') closeFreeModal();
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closeFreeModal();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
