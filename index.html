<script>
// ====== Timetable App Logic ======
(function(){
  "use strict";

  const DATA = APPDATA;
  const TEACHERS = DATA.teachers;
  const CLASSES = DATA.classes || [];
  const ROOMS = DATA.specialRooms || [];
  const DAY_MAP = DATA.dayMap;
  const CYCLE_WEEK = DATA.cycleWeek;
  const SPECIAL_DAYS = DATA.specialDays;
  const SPECIAL_LABELS = DATA.specialLabels;
  const WEEKS = DATA.weeks;
  const DUTY_INDEX = DATA.dutyIndex || {};

  const WEEKDAY_NAMES = ['','星期一','星期二','星期三','星期四','星期五'];
  const WEEKDAY_KEYS  = ['','Mon','Tue','Wed','Thu','Fri'];
  const MONTH_ZH = n => n + '月';

  const MODE_LABELS = {teacher:'教師', class:'班別', room:'特別室', reschedule:'調堂記錄', mutualFree:'共同空堂'};
  const MODE_SUBTITLES = {teacher:'教師個人時間表', class:'班別上課時間表', room:'特別室時間表', reschedule:'調堂記錄', mutualFree:'教師共同空堂查詢'};
  const MODE_LISTS = {teacher: TEACHERS, class: CLASSES, room: ROOMS};

  // 0-based lesson-period index -> {label, time}, e.g. 0 -> {label:'第1節', time:'08:25-09:00'}
  const PERIOD_OPTIONS = [
    {idx:0, label:'第1節', time:'08:25-09:00'},
    {idx:1, label:'第2節', time:'09:00-09:35'},
    {idx:2, label:'第3節', time:'09:35-10:10'},
    {idx:3, label:'第4節', time:'10:25-11:00'},
    {idx:4, label:'第5節', time:'11:00-11:35'},
    {idx:5, label:'第6節', time:'11:50-12:25'},
    {idx:6, label:'第7節', time:'12:25-13:00'},
    {idx:7, label:'第8節', time:'14:00-14:35'},
  ];
  function periodLabel(idx){
    const p = PERIOD_OPTIONS[idx];
    return p ? (p.label + '（' + p.time + '）') : ('第' + (idx+1) + '節');
  }

  // Row definitions in display order.
  // dutyRow  = pure duty slot (no lesson fallback, just duty-or-blank) -- teacher view only
  // dutySlot = a break/fixed slot that shows duty when assigned, else its generic label -- teacher view only
  // merged   = single label spanning the week (uniform every school day, e.g. homeroom)
  // idx / weekdayBased = real lesson-period cell
  const ROWS_TEACHER = [
    {key:'dutyA',         label:'課前值日',   time:'07:30-07:45', dutyRow:true, dutySlot:'morningA'},
    {key:'dutyB',         label:'課前值日',   time:'07:45-08:00', dutyRow:true, dutySlot:'morningB'},
    {key:'earlyExercise', label:'早操',     time:'07:55-08:00', fixed:true, merged:true},
    {key:'assembly',      label:'早會',     time:'08:00-08:10', fixed:true},
    {key:'homeroom',      label:'班主任課', time:'08:10-08:25', fixed:true, merged:true},
    {key:'period0',       label:'第1節',    time:'08:25-09:00', idx:0},
    {key:'period1',       label:'第2節',    time:'09:00-09:35', idx:1},
    {key:'period2',       label:'第3節',    time:'09:35-10:10', idx:2},
    {key:'break1',        label:'小息一',   time:'10:10-10:25', fixed:true, dutySlot:'recess1'},
    {key:'period3',       label:'第4節',    time:'10:25-11:00', idx:3},
    {key:'period4',       label:'第5節',    time:'11:00-11:35', idx:4},
    {key:'break2',        label:'小息二',   time:'11:35-11:50', fixed:true, dutySlot:'recess2'},
    {key:'period5',       label:'第6節',    time:'11:50-12:25', idx:5},
    {key:'period6',       label:'第7節',    time:'12:25-13:00', idx:6},
    {key:'lunch',         label:'午膳',     time:'13:00-13:30', fixed:true, dutySlot:'lunch'},
    {key:'break3',        label:'小息三',   time:'13:30-14:00', fixed:true, dutySlot:'recess3'},
    {key:'period7',       label:'第8節',    time:'14:00-14:35', idx:7},
    {key:'period9',       label:'第9節',    time:'14:35-15:20', weekdayBased:true},
  ];
  // Class / room views: no duty data, so breaks & lunch are plain fixed rows.
  const ROWS_PLAIN = [
    {key:'earlyExercise', label:'早操',     time:'07:55-08:00', fixed:true, merged:true},
    {key:'assembly',      label:'早會',     time:'08:00-08:10', fixed:true},
    {key:'homeroom',      label:'班主任課', time:'08:10-08:25', fixed:true, merged:true},
    {key:'period0',       label:'第1節',    time:'08:25-09:00', idx:0},
    {key:'period1',       label:'第2節',    time:'09:00-09:35', idx:1},
    {key:'period2',       label:'第3節',    time:'09:35-10:10', idx:2},
    {key:'break1',        label:'小息一',   time:'10:10-10:25', fixed:true, merged:true},
    {key:'period3',       label:'第4節',    time:'10:25-11:00', idx:3},
    {key:'period4',       label:'第5節',    time:'11:00-11:35', idx:4},
    {key:'break2',        label:'小息二',   time:'11:35-11:50', fixed:true, merged:true},
    {key:'period5',       label:'第6節',    time:'11:50-12:25', idx:5},
    {key:'period6',       label:'第7節',    time:'12:25-13:00', idx:6},
    {key:'lunch',         label:'午膳',     time:'13:00-13:30', fixed:true, merged:true},
    {key:'break3',        label:'小息三',   time:'13:30-14:00', fixed:true, merged:true},
    {key:'period7',       label:'第8節',    time:'14:00-14:35', idx:7},
    {key:'period9',       label:'第9節',    time:'14:35-15:20', weekdayBased:true},
  ];
  function activeRows(){ return state.mode === 'teacher' ? ROWS_TEACHER : ROWS_PLAIN; }

  // ---------- date helpers ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function toKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ // Monday
    const r = new Date(d);
    const dow = r.getDay(); // 0 Sun .. 6 Sat
    const diff = (dow === 0) ? -6 : (1 - dow);
    r.setDate(r.getDate() + diff);
    r.setHours(0,0,0,0);
    return r;
  }
  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function weekdayIdx(d){ const dow = d.getDay(); return (dow>=1 && dow<=5) ? dow : null; } // 1..5 = Mon..Fri

  function dayInfo(key){
    const v = DAY_MAP[key];
    if(!v) return {type:'unset'};
    if(v.indexOf('Day') === 0) return {type:'schoolday', day:v};
    return {type:'special', code:v, detail: SPECIAL_DAYS[key]};
  }
  function cycleParity(key){
    const wk = CYCLE_WEEK[key];
    if(!wk) return null;
    return {week:wk, parity: (wk % 2 === 1) ? 'odd' : 'even'};
  }

  // ---------- duty lookup ----------
  function bareName(name){
    let s = String(name || '').trim();
    // Strip a trailing parenthetical, e.g. "許碧玉老師  (1A班主任)" -> "許碧玉老師"
    s = s.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
    // Strip trailing role/title words, e.g. "老師" / "主任" / "副校長"
    s = s.replace(/(副校長|校長|副主任|主任|老師)+$/, '').trim();
    return s;
  }
  function getDuty(teacher, dayKey, slot){
    const entries = (DUTY_INDEX[bareName(teacher.name)] || {})[dayKey];
    if(!entries) return null;
    return entries.find(e => e.slot === slot) || null;
  }

  // ---------- class + subject colour coding (full cell fill) ----------
  function splitLocation(loc){
    if(!loc) return {room:'', code:null};
    const m = loc.match(/([1-6])\s*([A-Za-z])(?![A-Za-z])/);
    if(!m) return {room: loc.trim(), code:null};
    const code = (m[1] + m[2]).toUpperCase();
    const room = (loc.slice(0, m.index) + loc.slice(m.index + m[0].length)).trim();
    return {room, code};
  }
  function goldenPalette(keys){
    const map = {};
    // Full hue spectrum (golden-angle spacing) for maximum variety between
    // keys, tuned for a vivid-but-readable pastel look: saturated enough
    // to feel colourful, lightness kept high enough for dark text to read.
    keys.forEach((k, i) => {
      const hue = Math.round((i * 137.508) % 360);
      const light = 82 - (i % 3) * 4;                 // 82 / 78 / 74
      const sat = 68 + (i % 4) * 8;                    // 68 / 76 / 84 / 92
      map[k] = 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
    });
    return map;
  }
  const COMBO_PALETTE = (function(){
    const set = new Set();
    TEACHERS.forEach(t => {
      t.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => {
            const {code} = splitLocation(e.location || '');
            if(code) set.add(code + '::' + e.subject);
          });
        });
      });
    });
    ROOMS.forEach(r => {
      r.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => {
            if(e.classCode) set.add(e.classCode + '::' + e.subject);
          });
        });
      });
    });
    return goldenPalette(Array.from(set).sort());
  })();
  const SUBJECT_PALETTE = (function(){
    const set = new Set();
    CLASSES.forEach(c => {
      c.periods.forEach(p => {
        Object.values(p.byDay).forEach(list => {
          (list || []).forEach(e => { if(e.subject) set.add(e.subject); });
        });
      });
    });
    return goldenPalette(Array.from(set).sort());
  })();
  function comboColor(code, subject){
    const key = code + '::' + subject;
    if(COMBO_PALETTE[key]) return COMBO_PALETTE[key];
    let hash = 0;
    for(let i=0;i<key.length;i++){ hash = key.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
    const hue = Math.abs(hash) % 360;
    return 'hsl(' + hue + ',72%,80%)';
  }
  function subjectColor(subject){
    if(SUBJECT_PALETTE[subject]) return SUBJECT_PALETTE[subject];
    let hash = 0;
    for(let i=0;i<subject.length;i++){ hash = subject.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
    const hue = Math.abs(hash) % 360;
    return 'hsl(' + hue + ',72%,80%)';
  }

  // Shared per-record colour, used both in the 調堂記錄 grid and as the
  // override colour shown on the normal teacher/class timetable, so the same
  // record always reads as the same colour everywhere.
  const RECORD_COLOR_PALETTE = [
    {bg:'#e3f8ec', text:'#17784a', border:'#aee9c8'},
    {bg:'#fde7f1', text:'#b8296e', border:'#f6bcda'},
    {bg:'#eee7fc', text:'#6a3bc2', border:'#d2c0f5'},
    {bg:'#fff0da', text:'#a9620a', border:'#f7d49a'},
    {bg:'#e1f1fb', text:'#15679e', border:'#aed9f0'},
    {bg:'#fbe8e6', text:'#c0392b', border:'#f4bfb8'},
  ];
  function recordColor(id){
    let hash = 0;
    const s = String(id || '');
    for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
    return RECORD_COLOR_PALETTE[Math.abs(hash) % RECORD_COLOR_PALETTE.length];
  }

  // ---------- state ----------
  const state = {
    date: new Date(),
    view: (window.matchMedia('(max-width: 768px)').matches) ? 'day' : 'week',
    mode: 'teacher',
    entityIdx: {teacher: 0, class: 0, room: 0},
    calOpen: false,
    calTab: 'date',
    calMonthCursor: new Date(),
    reschedules: [],        // live-synced from Firestore
    rescheduleEditingId: null,
    rescheduleViewMode: 'grid',  // 'grid' (timetable, click a cell to add/edit) | 'list'
    rescheduleSearchQuery: '',
    rescheduleListLimit: 50,  // how many (unfiltered) records to render before "load more"
    rescheduleMonthFilter: '',  // '' = all months, else 'YYYY-M' (M is 0-based)
    mfSelected: []           // selected teacher full names for 共同空堂
  };
  state.date.setHours(0,0,0,0);

  // Picks the entry matching the current cycle-week parity from a byDay entry
  // list. An entry with parity:null applies every week; otherwise it must
  // match the current week's odd/even parity.
  function pickEntry(list, dateKey){
    if(!list || !list.length) return null;
    const par = cycleParity(dateKey);
    const match = list.find(e => !e.parity || (par && e.parity === par.parity));
    return match || null;
  }

  // Returns the list of teacher names with no lesson scheduled at the given
  // calendar date + lesson-period index (0-based, matching ROWS' `idx`).
  // Returns null if the date isn't a normal school day (holiday/unset/special).
  function freeTeachersAt(dateKey, periodIdx){
    const info = dayInfo(dateKey);
    if(info.type !== 'schoolday') return null;
    const dayKey = info.day;
    const free = [];
    TEACHERS.forEach(t => {
      const period = t.periods[periodIdx];
      const list = period ? period.byDay[dayKey] : null;
      const e = pickEntry(list, dateKey);
      if(!e) free.push(t.name);
    });
    return free;
  }

  // Returns the list of teacher names with no duty assigned at the given
  // calendar date + duty slot key (morningA/morningB/recess1/recess2/recess3/lunch).
  function freeTeachersForSlot(dateKey, slotKey){
    const info = dayInfo(dateKey);
    if(info.type !== 'schoolday') return null;
    const dayKey = info.day;
    const free = [];
    TEACHERS.forEach(t => {
      if(!getDuty(t, dayKey, slotKey)) free.push(t.name);
    });
    return free;
  }

  // ---------- lesson-period cell content ----------
  function getCellContent(entity, rowDef, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);

    if(!wIdx){ return {state:'unset'}; }
    if(info.type === 'unset'){ return {state:'unset'}; }
    if(info.type === 'special'){ return {state:'special', code: info.code}; }

    const wd = WEEKDAY_KEYS[wIdx];

    if(rowDef.key === 'earlyExercise'){
      return entity.earlyExercise ? {state:'filled', main: entity.earlyExercise} : {state:'empty'};
    }
    if(rowDef.key === 'assembly'){
      const main = (entity.assemblyMain || {})[wd] || '';
      const sub = (entity.assemblySub || {})[wd] || '';
      if(!main && !sub) return {state:'empty'};
      return {state:'filled', main:main, sub:sub};
    }
    if(rowDef.key === 'homeroom'){
      return entity.homeroom ? {state:'filled', main: entity.homeroom} : {state:'empty'};
    }
    if(rowDef.weekdayBased){
      const e = (entity.period9 || {})[wd];
      return e ? {state:'filled', main:e.subject} : {state:'empty'};
    }
    if(rowDef.idx !== undefined){
      const dayKey = info.day; // Day1..Day6
      const period = entity.periods[rowDef.idx];
      const list = period.byDay[dayKey];
      const e = pickEntry(list, key);
      if(!e) return {state:'empty'};
      return {state:'filled', entry: e};
    }
    return {state:'empty'};
  }

  // ---------- rendering ----------
  function currentEntity(){ return MODE_LISTS[state.mode][state.entityIdx[state.mode]]; }

  function entityLabel(mode, e){
    if(mode === 'room') return e.name;
    return e.name;
  }
  function populateEntitySelect(){
    const sel = document.getElementById('entitySelect');
    const list = MODE_LISTS[state.mode];
    sel.innerHTML = '';
    list.forEach((e, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = entityLabel(state.mode, e);
      sel.appendChild(opt);
    });
    sel.value = state.entityIdx[state.mode];
  }
  // Shows/hides the shared calendar grid vs. the 調堂記錄 list, depending on
  // mode and (within reschedule mode) state.rescheduleViewMode.
  // Shows/hides the shared calendar grid vs. the 調堂記錄 list vs. the
  // 共同空堂 panel, depending on mode and (within reschedule mode)
  // state.rescheduleViewMode.
  function updateModeLayout(){
    const isReschedule = (state.mode === 'reschedule');
    const isMutualFree = (state.mode === 'mutualFree');
    const showGrid = !isReschedule && !isMutualFree || (isReschedule && state.rescheduleViewMode === 'grid');
    document.getElementById('rescheduleToolbar').style.display = isReschedule ? 'flex' : 'none';
    document.querySelector('.calheader').style.display = showGrid ? '' : 'none';
    document.querySelector('.grid-wrap').style.display = showGrid ? '' : 'none';
    document.getElementById('rescheduleView').style.display = (isReschedule && state.rescheduleViewMode === 'list') ? 'block' : 'none';
    document.getElementById('mutualFreeView').classList.toggle('active', isMutualFree);
    document.querySelectorAll('#rescheduleViewToggle button').forEach(b => b.classList.toggle('active', b.dataset.rview === state.rescheduleViewMode));
  }

  function setMode(mode){
    if(state.mode === mode) return;
    state.mode = mode;
    document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('modeSubtitle').textContent = MODE_SUBTITLES[mode];

    const needsNoEntity = (mode === 'reschedule' || mode === 'mutualFree');
    document.querySelector('.entity-select-wrap').style.display = needsNoEntity ? 'none' : '';
    updateModeLayout();

    if(needsNoEntity){
      renderAll();
    } else {
      document.getElementById('entityLabel').textContent = MODE_LABELS[mode];
      populateEntitySelect();
      renderAll();
    }
  }

  function renderTitle(){
    const el = document.getElementById('calTitle');
    let refDate;
    if(state.view === 'week'){
      const mon = startOfWeek(state.date);
      refDate = addDays(mon, 2); // Wednesday represents the week's month
    } else {
      refDate = state.date;
    }
    let html = refDate.getFullYear() + '年' + MONTH_ZH(refDate.getMonth()+1);
    const par = cycleParity(toKey(refDate));
    if(par){
      html += '<span class="weekbadge">第 ' + par.week + ' 循環週 · ' + (par.parity==='odd' ? '單週' : '雙週') + '</span>';
    }
    el.innerHTML = html;
  }

  function badgeHtml(info){
    if(info.type === 'schoolday'){
      return '<span class="badge">' + info.day.replace('Day','Day ') + '</span>';
    }
    if(info.type === 'special'){
      return '<span class="badge special-' + info.code + '">DAY ' + info.code + '</span>';
    }
    return '<span class="badge unset">未設定</span>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Pure duty-slot cell (dutyA / dutyB rows): duty-or-blank, day-indexed. Teacher view only.
  function dutyOnlyCellHtml(teacher, dutySlot, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);
    if(!wIdx || info.type !== 'schoolday') return '<td class="cell empty"></td>';
    const attrs = ' data-duty-slot="' + dutySlot + '" data-date-key="' + key + '"';
    const d = getDuty(teacher, info.day, dutySlot);
    if(d){
      return '<td class="cell duty-cell clickable"' + attrs + '><span class="duty-tag">值日</span><span class="duty-loc">' + escapeHtml(d.location) + '</span></td>';
    }
    return '<td class="cell empty clickable"' + attrs + '></td>';
  }

  // Break/fixed cell that shows duty when assigned, else its generic label. Teacher view only.
  function breakCellHtml(teacher, rowDef, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);
    if(!wIdx || info.type !== 'schoolday') return '<td class="cell empty"></td>';
    const attrs = ' data-duty-slot="' + rowDef.dutySlot + '" data-date-key="' + key + '"';
    const d = getDuty(teacher, info.day, rowDef.dutySlot);
    if(d){
      return '<td class="cell duty-cell clickable"' + attrs + '><span class="duty-tag">值日</span><span class="duty-loc">' + escapeHtml(d.location) + '</span></td>';
    }
    return '<td class="cell merged clickable"' + attrs + '>' + escapeHtml(rowDef.label) + '</td>';
  }

  // Renders one lesson-period entry, styled differently per view:
  //  - teacher entries carry `location` (room + optional class code) -- unchanged look
  //  - room entries carry `classCode` -- badge shows the visiting class
  //  - class entries carry `teacher` only -- coloured by subject
  // meta (optional): {periodIdx, dateKey} -- makes the cell clickable to show free teachers.
  function entryCellHtml(entry, meta){
    let cellStyle = '';
    let html = '<span class="subj">' + escapeHtml(entry.subject) + '</span>';
    if(entry.classCode !== undefined && entry.classCode !== null){
      const bg = comboColor(entry.classCode, entry.subject);
      cellStyle = 'background:' + bg + ';';
      html += '<span class="loc-wrap"><span class="class-chip">' + escapeHtml(entry.classCode) + '</span>';
      if(entry.teacher) html += '<span class="room">' + escapeHtml(entry.teacher) + '</span>';
      html += '</span>';
    } else if(entry.location !== undefined){
      if(entry.location){
        const parsed = splitLocation(entry.location);
        html += '<span class="loc-wrap">';
        if(parsed.room) html += '<span class="room">' + escapeHtml(parsed.room) + '</span>';
        if(parsed.code){
          const bg = comboColor(parsed.code, entry.subject);
          cellStyle = 'background:' + bg + ';';
          html += '<span class="class-chip">' + parsed.code + '</span>';
        }
        html += '</span>';
      }
    } else if(entry.teacher){
      const bg = subjectColor(entry.subject);
      cellStyle = 'background:' + bg + ';';
      html += '<span class="loc-wrap"><span class="room">' + escapeHtml(entry.teacher) + '</span></span>';
    }
    const cls = 'cell' + (meta ? ' clickable' : '');
    const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
    return '<td class="' + cls + '"' + attrs + (cellStyle ? ' style="' + cellStyle + '"' : '') + '>' + html + '</td>';
  }

  // A 調堂 record overrides what's actually happening at this exact cell, so
  // (unlike a normal cell) it fully replaces the computed timetable content
  // rather than overlaying it. overlay: {record, entry:{teacher,class}}.
  // Uses one fixed, bold colour (not the per-record cycling colour used in
  // the 調堂記錄 grid) so every override reads as the same unmistakable
  // "this changed" signal across the whole teacher/class timetable.
  const OVERRIDE_COLOR = {bg:'#dc2626', text:'#ffffff', border:'#991b1b'};
  function overrideCellHtml(overlay, meta){
    const entry = overlay.entry;
    const mainText = (state.mode === 'class') ? teacherDisplayName(entry.teacher) : entry.class;
    const cls = 'cell resched-cell clickable';
    const attrs = ' data-resched-id="' + overlay.record.id + '"' + (meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '');
    const style = ' style="background:' + OVERRIDE_COLOR.bg + ';border:2px solid ' + OVERRIDE_COLOR.border + ';"';
    let html = '<span class="subj" style="color:' + OVERRIDE_COLOR.text + ';font-weight:800;">' + escapeHtml(mainText) + '</span>';
    html += '<span class="resched-badge" style="background:' + OVERRIDE_COLOR.border + ';color:' + OVERRIDE_COLOR.text + ';">調堂</span>';
    return '<td class="' + cls + '"' + attrs + style + '>' + html + '</td>';
  }

  // Regular lesson-period / fixed-text cell.
  // meta (optional): {periodIdx, dateKey} -- makes the cell clickable to show free teachers.
  // resched (optional): {record, entry} -- a 調堂 override for this exact cell, see overrideCellHtml().
  function cellHtml(content, meta, resched){
    if(resched) return overrideCellHtml(resched, meta);
    if(content.state === 'unset' || content.state === 'special'){
      return '<td class="cell empty"></td>';
    }
    if(content.state === 'empty'){
      const cls = 'cell empty' + (meta ? ' clickable' : '');
      const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
      return '<td class="' + cls + '"' + attrs + '></td>';
    }
    if(content.entry){
      return entryCellHtml(content.entry, meta);
    }
    let html = '<span class="subj">' + escapeHtml(content.main) + '</span>';
    if(content.sub){
      html += '<span class="loc-wrap"><span class="room">' + escapeHtml(content.sub) + '</span></span>';
    }
    const cls = 'cell' + (meta ? ' clickable' : '');
    const attrs = meta ? ' data-period-idx="' + meta.periodIdx + '" data-date-key="' + meta.dateKey + '"' : '';
    return '<td class="' + cls + '"' + attrs + '>' + html + '</td>';
  }

  function renderWeek(){
    const table = document.getElementById('ttTable');
    const entity = currentEntity();
    const rows = activeRows();
    const mon = startOfWeek(state.date);
    const days = [1,2,3,4,5].map(i => addDays(mon, i-1));
    const today = new Date(); today.setHours(0,0,0,0);

    let thead = '<thead><tr><th class="corner col-label">節數</th>';
    days.forEach((d, i) => {
      const key = toKey(d);
      const info = dayInfo(key);
      const isToday = sameDate(d, today);
      thead += '<th class="daycol' + (isToday?' is-today':'') + '">' +
        '<div class="wd">' + WEEKDAY_NAMES[i+1] + '</div>' +
        '<div class="dnum">' + d.getDate() + '</div>' +
        badgeHtml(info) +
        '</th>';
    });
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    rows.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      const dutyRowClass = (rowDef.dutyRow || rowDef.dutySlot) ? ' duty-row' : '';
      tbody += '<tr class="' + rowClass + dutyRowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';

      if(rowDef.dutyRow){
        days.forEach(d => {
          tbody += dutyOnlyCellHtml(entity, rowDef.dutySlot, d);
        });
      } else if(rowDef.merged){
        let anySchool = days.some(d => { const t = dayInfo(toKey(d)).type; return t !== 'unset' && t !== 'special'; });
        if(!anySchool){
          tbody += '<td class="cell empty" colspan="5"></td>';
        } else {
          const sample = getCellContent(entity, rowDef, days.find(d => dayInfo(toKey(d)).type === 'schoolday') || days[0]);
          const text = (sample.state === 'filled') ? sample.main : rowDef.label;
          tbody += '<td class="cell merged" colspan="5">' + escapeHtml(text) + '</td>';
        }
      } else if(rowDef.dutySlot){
        days.forEach(d => {
          tbody += breakCellHtml(entity, rowDef, d);
        });
      } else {
        days.forEach(d => {
          const content = getCellContent(entity, rowDef, d);
          const meta = (rowDef.idx !== undefined) ? {periodIdx: rowDef.idx, dateKey: toKey(d)} : null;
          const resched = meta ? getReschedOverlay(entity, meta.dateKey, meta.periodIdx) : null;
          tbody += cellHtml(content, meta, resched);
        });
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';

    table.innerHTML = thead + tbody;
  }

  function DOW_toFull(dow){ return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dow]; }

  function renderDay(){
    const table = document.getElementById('ttTable');
    const entity = currentEntity();
    const rows = activeRows();
    const d = state.date;
    const key = toKey(d);
    const info = dayInfo(key);
    const wIdx = weekdayIdx(d);
    const today = new Date(); today.setHours(0,0,0,0);
    const isToday = sameDate(d, today);

    const headerBadge = badgeHtml(wIdx ? info : {type:'unset'});
    let thead = '<thead><tr><th class="corner col-label">節數</th>' +
      '<th class="daycol' + (isToday?' is-today':'') + '">' +
      '<div class="wd">' + (wIdx ? WEEKDAY_NAMES[wIdx] : DOW_toFull(d.getDay())) + '</div>' +
      '<div class="dnum">' + d.getDate() + ' 日</div>' +
      headerBadge +
      '</th></tr></thead>';
    let tbody = '<tbody>';

    if(!wIdx || info.type === 'special' || info.type === 'unset'){
      let msg;
      if(!wIdx) msg = '週末，沒有課堂安排。';
      else if(info.type === 'special') msg = 'DAY ' + info.code + ' · ' + (SPECIAL_LABELS[info.code] || info.code) + '，沒有指定課節資料。';
      else msg = '此日期尚未設定循環日資料。';
      tbody += '<tr><td class="cell empty no-data-msg" colspan="2">' + escapeHtml(msg) + '</td></tr>';
      tbody += '</tbody>';
      table.innerHTML = thead + tbody;
      return;
    }

    rows.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      const dutyRowClass = (rowDef.dutyRow || rowDef.dutySlot) ? ' duty-row' : '';
      tbody += '<tr class="' + rowClass + dutyRowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';

      if(rowDef.dutyRow){
        tbody += dutyOnlyCellHtml(entity, rowDef.dutySlot, d);
      } else if(rowDef.merged){
        const content = getCellContent(entity, rowDef, d);
        const text = (content.state === 'filled') ? content.main : rowDef.label;
        tbody += '<td class="cell merged">' + escapeHtml(text) + '</td>';
      } else if(rowDef.dutySlot){
        tbody += breakCellHtml(entity, rowDef, d);
      } else {
        const content = getCellContent(entity, rowDef, d);
        const meta = (rowDef.idx !== undefined) ? {periodIdx: rowDef.idx, dateKey: toKey(d)} : null;
        const resched = meta ? getReschedOverlay(entity, meta.dateKey, meta.periodIdx) : null;
        tbody += cellHtml(content, meta, resched);
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
  }

  function renderGrid(){
    if(state.mode === 'reschedule'){
      if(state.view === 'week') renderRescheduleWeek(); else renderRescheduleDay();
      return;
    }
    if(state.view === 'week') renderWeek(); else renderDay();
  }

  function renderViewToggle(){
    document.getElementById('viewWeekBtn').classList.toggle('active', state.view === 'week');
    document.getElementById('viewDayBtn').classList.toggle('active', state.view === 'day');
    document.body.classList.toggle('day-view', state.view === 'day');
  }

  function renderAll(){
    if(state.mode === 'mutualFree'){
      renderMfChips();
      renderMfResults();
      return;
    }
    if(state.mode === 'reschedule' && state.rescheduleViewMode === 'list'){
      renderRescheduleList();
      return;
    }
    renderTitle();
    renderViewToggle();
    renderGrid();
    if(state.calOpen) renderCalendarPopover();
  }

  // ---------- calendar popover ----------
  function renderCalendarPopover(){
    document.getElementById('tabDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('tabWeek').classList.toggle('active', state.calTab==='week');
    document.getElementById('panelDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('panelWeek').classList.toggle('active', state.calTab==='week');

    if(state.calTab === 'date'){
      renderMonthGrid();
    } else {
      renderWeekList();
    }
  }

  function renderMonthGrid(){
    const cursor = state.calMonthCursor;
    const y = cursor.getFullYear(), m = cursor.getMonth();
    document.getElementById('cpMonthLabel').textContent = y + '年' + MONTH_ZH(m+1);
    const grid = document.getElementById('cpGrid');
    let html = '';
    ['一','二','三','四','五','六','日'].forEach(l => html += '<div class="dow">' + l + '</div>');

    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() === 0) ? 6 : first.getDay()-1; // Monday-first
    const gridStart = addDays(first, -startOffset);
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<42;i++){
      const d = addDays(gridStart, i);
      const key = toKey(d);
      const inMonth = d.getMonth() === m;
      const isWeekend = !weekdayIdx(d);
      const info = dayInfo(key);
      const isSchool = !isWeekend && (info.type !== 'unset');
      const classes = ['cp-day'];
      if(!inMonth) classes.push('out');
      if(isWeekend) classes.push('weekend');
      if(isSchool) classes.push('school'); else if(inMonth && !isWeekend) classes.push('disabled');
      if(sameDate(d, today)) classes.push('today');
      if(sameDate(d, state.date)) classes.push('selected');
      html += '<button type="button" class="' + classes.join(' ') + '" data-key="' + key + '">' + d.getDate() + '</button>';
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cp-day').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.key);
        closeCalendar();
        renderAll();
      });
    });
  }

  function renderWeekList(){
    const host = document.getElementById('weekList');
    let html = '';
    WEEKS.forEach(w => {
      html += '<button type="button" class="week-item" data-date="' + w.firstDate + '">' +
        '<b>第 ' + w.week + ' 循環週 · ' + (w.week % 2 === 1 ? '單週' : '雙週') + '</b>' +
        '<span class="range">' + w.label + '</span>' +
        '</button>';
    });
    host.innerHTML = html;
    host.querySelectorAll('.week-item').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.date);
        state.calMonthCursor = new Date(state.date);
        closeCalendar();
        renderAll();
      });
    });
  }

  function openCalendar(){
    state.calOpen = true;
    state.calMonthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    document.getElementById('calPop').classList.add('open');
    renderCalendarPopover();
  }
  function closeCalendar(){
    state.calOpen = false;
    document.getElementById('calPop').classList.remove('open');
  }

  // ---------- navigation ----------
  function goPrev(){
    state.date = addDays(state.date, state.view === 'week' ? -7 : -1);
    renderAll();
  }
  function goNext(){
    state.date = addDays(state.date, state.view === 'week' ? 7 : 1);
    renderAll();
  }
  function goToday(){
    state.date = new Date(); state.date.setHours(0,0,0,0);
    renderAll();
  }
  function setView(v){
    state.view = v;
    renderAll();
  }

  // ---------- free-teacher modal ----------
  const PERIOD_ROW_BY_IDX = {};
  const SLOT_ROW_BY_KEY = {};
  ROWS_TEACHER.forEach(r => {
    if(r.idx !== undefined) PERIOD_ROW_BY_IDX[r.idx] = r;
    if(r.dutySlot) SLOT_ROW_BY_KEY[r.dutySlot] = r;
  });

  // opts: {kind:'period', idx} for lesson periods, or {kind:'duty', slot} for
  // 課前值日／小息一二三／午膳 rows.
  function openFreeModal(dateKey, opts){
    let rowDef, free, isDuty;
    if(opts.kind === 'duty'){
      rowDef = SLOT_ROW_BY_KEY[opts.slot];
      free = freeTeachersForSlot(dateKey, opts.slot);
      isDuty = true;
    } else {
      rowDef = PERIOD_ROW_BY_IDX[opts.idx];
      free = freeTeachersAt(dateKey, opts.idx);
      isDuty = false;
    }
    const d = fromKey(dateKey);
    const info = dayInfo(dateKey);
    const dateLabel = (d.getMonth()+1) + '月' + d.getDate() + '日（' + DOW_toFull(d.getDay()) + '）';
    const dayBadge = (info.type === 'schoolday') ? info.day.replace('Day','Day ') : '';
    const titleSuffix = isDuty ? ' 沒有值日的老師' : ' 空堂老師';

    document.getElementById('freeModalTitle').innerHTML =
      escapeHtml((rowDef ? rowDef.label : '') + titleSuffix) +
      '<span class="sub">' + escapeHtml(dateLabel + (dayBadge ? '　' + dayBadge : '') + (rowDef ? '　' + rowDef.time : '')) + '</span>';

    const countEl = document.getElementById('freeModalCount');
    const gridEl = document.getElementById('freeModalGrid');

    if(free === null){
      countEl.textContent = '';
      gridEl.innerHTML = '<div class="free-modal-empty">當日並非恆常上課日，沒有相關資料。</div>';
    } else if(free.length === 0){
      countEl.textContent = isDuty ? '所有教師這節皆有值日安排。' : '所有教師這節皆有課節。';
      gridEl.innerHTML = '';
    } else {
      countEl.textContent = isDuty ? ('共 ' + free.length + ' 位老師這節沒有值日：') : ('共 ' + free.length + ' 位老師這節空堂：');
      gridEl.innerHTML = free.map(name => '<span class="free-teacher-chip">' + escapeHtml(name.replace(/\s+/g, ' ').trim()) + '</span>').join('');
    }

    document.getElementById('freeModalBackdrop').classList.add('open');
  }
  function closeFreeModal(){
    document.getElementById('freeModalBackdrop').classList.remove('open');
  }

  // ---------- 調堂記錄 (reschedule) ----------
  // Data model (matches the school's existing 調堂記錄表 tool, so historical
  // records can be imported as-is): a record is {date, slotId, entries, note}.
  // `entries` is a list of {teacher, class} pairs describing what is actually
  // happening for that one date+slot, overriding the normal computed
  // timetable -- `class` may be a real class code, or the special values
  // 空堂 (free / lesson cancelled) or 進修 (teacher away on professional
  // development). A two-entry record with one 空堂 side models a simple
  // swap; three-plus entries model a reshuffle.

  // Slot definitions -- verbatim from the existing tool so slotId values are
  // stable and any historical data imports without remapping. Only the 8
  // lesson periods (isOpen:true) are reschedulable.
  const SLOTS = [
    {id:'s1', name:'班主任課', time:'08:10-08:25', isOpen:false},
    {id:'s4', name:'第1節', time:'08:25-09:00', isOpen:true},
    {id:'s_1774269821978', name:'第2節', time:'09:00-09:35', isOpen:true},
    {id:'s_1774269888106', name:'第3節', time:'09:35-10:10', isOpen:true},
    {id:'s_1774269906692', name:'小息一', time:'10:10-10:25', isOpen:false},
    {id:'s_1774269931966', name:'第4節', time:'10:25-11:00', isOpen:true},
    {id:'s_1774269954324', name:'第5節', time:'11:00-11:35', isOpen:true},
    {id:'s_1774269989514', name:'小息二', time:'11:35-11:50', isOpen:false},
    {id:'s_1774269972712', name:'第6節', time:'11:50-12:25', isOpen:true},
    {id:'s_1774270007109', name:'第7節', time:'12:25-13:00', isOpen:true},
    {id:'s_1774270035198', name:'午膳', time:'13:00-13:30', isOpen:false},
    {id:'s_1774270050828', name:'小息三', time:'13:30-14:00', isOpen:false},
    {id:'s_1774270020608', name:'第8節', time:'14:00-14:35', isOpen:true},
    {id:'s18', name:'樂天學滿FUN', time:'14:35-15:20', isOpen:false},
  ];
  const SLOT_BY_ID = {};
  SLOTS.forEach(s => { SLOT_BY_ID[s.id] = s; });
  const OPEN_SLOTS = SLOTS.filter(s => s.isOpen);
  // The 8 open slots are in the same order as PERIOD_OPTIONS idx 0-7.
  const PERIOD_IDX_TO_SLOT_ID = {};
  const SLOT_ID_TO_PERIOD_IDX = {};
  OPEN_SLOTS.forEach((s, i) => { PERIOD_IDX_TO_SLOT_ID[i] = s.id; SLOT_ID_TO_PERIOD_IDX[s.id] = i; });

  const SPECIAL_CLASS_VALUES = ['空堂', '進修'];
  const RESCHEDULE_LIST_PAGE_SIZE = 50;

  // Full-name -> shortName, as used by the existing 調堂記錄 tool (and
  // matching the single-character codes already seen in location text
  // throughout the timetable data).
  const TEACHER_SHORTNAME_RAW = {
    '許碧玉':'許','李潔欣':'潔','陳寶如':'如','邱美華':'邱','張詠希':'張','彭富鴻':'富','黃秀玲':'秀',
    '姚森森':'姚','黃少華':'華','葉佩華':'佩','謝利':'利','陳憲樺':'憲','王新燕':'燕','劉敏聰':'聰',
    '劉泳炘':'炘','鄭凱迎':'鄭','陳雋彥':'彥','陳梓彤':'彤','施晉裕':'施','繆嘉旋':'繆','李燕麗':'麗',
    '林衍婷':'衍','劉秋婷':'秋','楊嘉慧':'楊','彭少婷':'婷','楊宇進':'進','黃嘉瑜':'瑜','梁婉儀':'婉',
    '莊榮昌':'莊','周曉勤':'勤','陳志紅':'紅','黃榮耀':'耀','葉盈':'葉','陳若楠':'楠','楊詠文':'詠',
    '甄昫盈':'昫','余嘉希':'余','梁恩奇':'奇','楊美貞':'貞','唐文慧':'唐','林紫茵':'茵','馮宝恩':'馮',
    '何嘉欣':'嘉','鄭惠施':'惠','何詩敏':'詩','馬曉嵐':'嵐','霍玉儀':'霍','蘇海蓉':'蘇',
    'MsStephanie':'Steph','老家倩':'倩','葉子澄':'澄','汪航羽':'汪','梅思婷':'梅','William':'William','Vivian':'Vivian'
  };

  function normalizeForMatch(name){
    return String(name || '').replace(/^(Mr|Ms|Mrs)\s*/i, '').replace(/\s+/g, '').trim();
  }

  // Drops a trailing homeroom/role parenthetical, e.g. "許碧玉老師 (1A班主任)"
  // -> "許碧玉老師" -- the 調堂記錄 feature shows teachers without this tag.
  function stripHomeroomTag(name){
    return String(name || '').replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  }

  // Built from the union of our own TEACHERS list and the legacy tool's
  // teacher list, so every known teacher resolves to a shortName.
  const TEACHER_SHORT_BY_FULLNAME = {};
  const TEACHER_FULLNAME_BY_SHORT = {};
  TEACHERS.forEach(t => {
    const bare = bareName(t.name);
    const norm = normalizeForMatch(bare);
    const short = TEACHER_SHORTNAME_RAW[bare] || TEACHER_SHORTNAME_RAW[norm];
    if(short){
      TEACHER_SHORT_BY_FULLNAME[t.name] = short;
      if(!TEACHER_FULLNAME_BY_SHORT[short]) TEACHER_FULLNAME_BY_SHORT[short] = stripHomeroomTag(t.name);
    }
  });
  // Teachers known to the legacy tool but not part of the current timetable
  // roster (e.g. support staff) -- still selectable in the form, they just
  // won't overlay onto any grid cell since they have no base timetable.
  const TEACHER_FORM_OPTIONS = TEACHERS.map(t => ({name: stripHomeroomTag(t.name), short: TEACHER_SHORT_BY_FULLNAME[t.name]})).filter(o => o.short);
  Object.keys(TEACHER_SHORTNAME_RAW).forEach(fullName => {
    const short = TEACHER_SHORTNAME_RAW[fullName];
    if(!TEACHER_FULLNAME_BY_SHORT[short]){
      TEACHER_FULLNAME_BY_SHORT[short] = stripHomeroomTag(fullName);
      TEACHER_FORM_OPTIONS.push({name: stripHomeroomTag(fullName), short: short});
    }
  });

  const CLASS_FORM_OPTIONS = CLASSES.map(c => c.id).concat(SPECIAL_CLASS_VALUES);

  function teacherDisplayName(shortName){
    return TEACHER_FULLNAME_BY_SHORT[shortName] || shortName;
  }

  // ---------- overlay lookup (grid cells) ----------
  function findRecordsFor(dateKey, slotId){
    return state.reschedules.filter(r => r.date === dateKey && r.slotId === slotId);
  }
  function getTeacherOverride(teacherFullName, dateKey, periodIdx){
    const slotId = PERIOD_IDX_TO_SLOT_ID[periodIdx];
    if(!slotId) return null;
    const shortName = TEACHER_SHORT_BY_FULLNAME[teacherFullName];
    if(!shortName) return null;
    for(const r of findRecordsFor(dateKey, slotId)){
      const entry = (r.entries || []).find(e => e.teacher === shortName);
      if(entry) return {record:r, entry:entry};
    }
    return null;
  }
  function getClassOverride(classCode, dateKey, periodIdx){
    const slotId = PERIOD_IDX_TO_SLOT_ID[periodIdx];
    if(!slotId) return null;
    for(const r of findRecordsFor(dateKey, slotId)){
      const entry = (r.entries || []).find(e => e.class === classCode);
      if(entry) return {record:r, entry:entry};
    }
    return null;
  }
  // Supported in teacher and class views only -- rooms aren't tracked by the
  // reschedule tool.
  function getReschedOverlay(entity, dateKey, periodIdx){
    if(!state.reschedules.length) return null;
    if(state.mode === 'teacher') return getTeacherOverride(entity.name, dateKey, periodIdx);
    if(state.mode === 'class') return getClassOverride(entity.id, dateKey, periodIdx);
    return null;
  }

  // Full date + weekday + cycle-day badge, e.g. "2026/9/15（二）· Day 1" --
  // used for search-matching so the year is searchable too.
  function fmtDateShort(dateKey){
    if(!dateKey) return '';
    const d = fromKey(dateKey);
    const info = dayInfo(dateKey);
    const dayTxt = (info.type === 'schoolday') ? info.day.replace('Day', 'Day ') : (info.type === 'special' ? info.code : '');
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + '（' + DOW_toFull(d.getDay()).replace('星期','') + '）' + (dayTxt ? ' · ' + dayTxt : '');
  }
  function fmtMonthHeader(dateKey){
    const d = fromKey(dateKey);
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月';
  }

  // ---------- list view ----------
  // Matches a record against the list search box:班別, 日期 or 教師姓名.
  function rescheduleMatchesSearch(r, query){
    if(!query) return true;
    const slot = SLOT_BY_ID[r.slotId];
    const haystack = [
      r.date || '',
      fmtDateShort(r.date) || '',
      slot ? slot.name : '',
      r.note || '',
    ].concat(
      (r.entries || []).flatMap(e => [teacherDisplayName(e.teacher), e.class || ''])
    ).join(' ').toLowerCase();
    return haystack.indexOf(query.toLowerCase()) !== -1;
  }

  function rescheduleRowHtml(r){
    const slot = SLOT_BY_ID[r.slotId];
    const slotTxt = slot ? slot.name : (r.slotId || '');
    const plainEntries = (r.entries || []).map(e => teacherDisplayName(e.teacher) + ' → ' + (e.class || '')).join('，');
    const entriesTxt = (r.entries || []).map(e => {
      const special = SPECIAL_CLASS_VALUES.indexOf(e.class) !== -1;
      return '<span class="rs-e' + (special ? ' special' : '') + '">' + escapeHtml(teacherDisplayName(e.teacher)) + ' → ' + escapeHtml(e.class || '') + '</span>';
    }).join('<span class="rs-sep">，</span> ');
    const noteTxt = r.note
      ? ('<span class="rs-note-inline" title="' + escapeHtml(r.note) + '">· ' + escapeHtml(r.note) + '</span>')
      : '<span class="rs-note-inline"></span>';
    return '<div class="rs-card" data-id="' + escapeHtml(r.id) + '">' +
      '<span class="rs-when">' + escapeHtml(fmtDateShort(r.date)) + ' ' + escapeHtml(slotTxt) + '</span>' +
      '<span class="rs-entries-inline" title="' + escapeHtml(plainEntries) + '">' + entriesTxt + '</span>' +
      noteTxt +
      '</div>';
  }

  function rescheduleMonthKey(dateKey){
    const d = fromKey(dateKey);
    return d.getFullYear() + '-' + d.getMonth();
  }

  // Rebuilds the month-filter <select> options from whatever months actually
  // have records, preserving the current selection if it's still valid.
  function populateRescheduleMonthSelect(){
    const sel = document.getElementById('rescheduleMonthSelect');
    const current = sel.value;
    const keys = Array.from(new Set(state.reschedules.map(r => rescheduleMonthKey(r.date))))
      .sort((a, b) => {
        const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number);
        return (by * 12 + bm) - (ay * 12 + am);
      });
    sel.innerHTML = '<option value="">所有月份</option>' + keys.map(k => {
      const [y, m] = k.split('-').map(Number);
      return '<option value="' + k + '">' + y + '年' + (m + 1) + '月</option>';
    }).join('');
    if(keys.indexOf(current) !== -1) sel.value = current;
    else state.rescheduleMonthFilter = '';
  }

  // Groups by year-month (so a full school year's worth of records doesn't
  // read as one undifferentiated wall), and paginates the unfiltered list
  // (a search or month filter already narrows things down, so those show
  // every match instead).
  function renderRescheduleList(){
    const listEl = document.getElementById('rescheduleList');
    populateRescheduleMonthSelect();
    const query = state.rescheduleSearchQuery.trim();
    const monthFilter = state.rescheduleMonthFilter;
    let filtered = state.reschedules.filter(r => rescheduleMatchesSearch(r, query));
    if(monthFilter) filtered = filtered.filter(r => rescheduleMonthKey(r.date) === monthFilter);

    if(!state.reschedules.length){
      listEl.innerHTML = '<div class="reschedule-empty">目前沒有調堂記錄。</div>';
      return;
    }
    if(!filtered.length){
      listEl.innerHTML = '<div class="reschedule-empty">找不到符合條件的調堂記錄。</div>';
      return;
    }

    const narrowed = !!query || !!monthFilter;
    const limit = narrowed ? filtered.length : Math.min(state.rescheduleListLimit, filtered.length);
    const shown = filtered.slice(0, limit);

    const groups = [];
    let currentKey = null, currentGroup = null;
    shown.forEach(r => {
      const key = rescheduleMonthKey(r.date);
      if(key !== currentKey){
        currentGroup = {header: fmtMonthHeader(r.date), rows: []};
        groups.push(currentGroup);
        currentKey = key;
      }
      currentGroup.rows.push(r);
    });

    let html = groups.map(g =>
      '<div class="rs-month-header">' + escapeHtml(g.header) + '</div>' + g.rows.map(rescheduleRowHtml).join('')
    ).join('');

    if(!narrowed && filtered.length > shown.length){
      html += '<button type="button" class="rs-load-more" id="rsLoadMoreBtn">載入更多（還有 ' + (filtered.length - shown.length) + ' 筆）</button>';
    }
    listEl.innerHTML = html;
  }

  // ---------- grid view (same layout as the school's old 調堂記錄 tool:
  // a weekly/daily timetable grid; an empty open-slot cell is clickable to
  // add a record for that date+slot, a filled one shows its entries and is
  // clickable to edit) ----------
  // Each matching record renders as its own coloured box (entries joined
  // inline as "老師(班別／狀態)", note shown below if present); a dashed
  // "+" control is always present underneath so another, independent record
  // can be added to the same date+slot (e.g. unrelated swaps happening at
  // the same time for different classes).
  function rescheduleCellHtml(dateKey, slot){
    if(!slot.isOpen){
      return '<td class="cell merged">' + escapeHtml(slot.name) + '</td>';
    }
    const info = dayInfo(dateKey);
    if(info.type !== 'schoolday'){
      return '<td class="cell empty"></td>';
    }
    const records = findRecordsFor(dateKey, slot.id);
    let html = '<div class="rg-cell-stack">';
    records.forEach(r => {
      const color = recordColor(r.id);
      const entriesTxt = (r.entries || []).map(e =>
        escapeHtml(teacherDisplayName(e.teacher)) + '（' + escapeHtml(e.class || '') + '）'
      ).join('，');
      html += '<div class="rg-record-box" data-resched-id="' + escapeHtml(r.id) + '"' +
        ' style="background:' + color.bg + ';color:' + color.text + ';border-color:' + color.border + ';">' +
        entriesTxt +
        (r.note ? '<div class="rg-record-note">' + escapeHtml(r.note) + '</div>' : '') +
        '</div>';
    });
    html += '<div class="rg-add-btn" data-date-key="' + dateKey + '" data-slot-id="' + slot.id + '">＋</div>';
    html += '</div>';
    return '<td class="cell rg-cell">' + html + '</td>';
  }

  function renderRescheduleWeek(){
    const table = document.getElementById('ttTable');
    const mon = startOfWeek(state.date);
    const days = [1,2,3,4,5].map(i => addDays(mon, i-1));
    const today = new Date(); today.setHours(0,0,0,0);

    let thead = '<thead><tr><th class="corner col-label">節數</th>';
    days.forEach((d, i) => {
      const key = toKey(d);
      const info = dayInfo(key);
      const isToday = sameDate(d, today);
      thead += '<th class="daycol' + (isToday?' is-today':'') + '">' +
        '<div class="wd">' + WEEKDAY_NAMES[i+1] + '</div>' +
        '<div class="dnum">' + d.getDate() + '</div>' +
        badgeHtml(info) +
        '</th>';
    });
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    SLOTS.forEach(slot => {
      tbody += '<tr class="' + (slot.isOpen ? '' : 'fixed-row') + '">';
      tbody += '<td class="period-label">' + slot.name + '<span class="time">' + slot.time + '</span></td>';
      days.forEach(d => { tbody += rescheduleCellHtml(toKey(d), slot); });
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
  }

  function renderRescheduleDay(){
    const table = document.getElementById('ttTable');
    const d = state.date;
    const key = toKey(d);
    const info = dayInfo(key);
    const wIdx = weekdayIdx(d);
    const today = new Date(); today.setHours(0,0,0,0);
    const isToday = sameDate(d, today);

    const headerBadge = badgeHtml(wIdx ? info : {type:'unset'});
    let thead = '<thead><tr><th class="corner col-label">節數</th>' +
      '<th class="daycol' + (isToday?' is-today':'') + '">' +
      '<div class="wd">' + (wIdx ? WEEKDAY_NAMES[wIdx] : DOW_toFull(d.getDay())) + '</div>' +
      '<div class="dnum">' + d.getDate() + ' 日</div>' +
      headerBadge +
      '</th></tr></thead>';
    let tbody = '<tbody>';

    if(!wIdx || info.type === 'special' || info.type === 'unset'){
      let msg;
      if(!wIdx) msg = '週末，沒有課堂安排。';
      else if(info.type === 'special') msg = 'DAY ' + info.code + ' · ' + (SPECIAL_LABELS[info.code] || info.code) + '，沒有指定課節資料。';
      else msg = '此日期尚未設定循環日資料。';
      tbody += '<tr><td class="cell empty no-data-msg" colspan="2">' + escapeHtml(msg) + '</td></tr>';
      tbody += '</tbody>';
      table.innerHTML = thead + tbody;
      return;
    }

    SLOTS.forEach(slot => {
      tbody += '<tr class="' + (slot.isOpen ? '' : 'fixed-row') + '">';
      tbody += '<td class="period-label">' + slot.name + '<span class="time">' + slot.time + '</span></td>';
      tbody += rescheduleCellHtml(key, slot);
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
  }

  // ---------- add/edit form ----------
  function populateFormSelects(){
    const slotSel = document.getElementById('rfSlot');
    slotSel.innerHTML = OPEN_SLOTS.map(s => '<option value="' + s.id + '">' + s.name + '（' + s.time + '）</option>').join('');
  }

  const ENTRY_BADGE_COLORS = ['#3b5bfd', '#1e9e6a', '#8e44ad', '#e67e22'];

  function entryRowHtml(entry){
    entry = entry || {teacher:'', class:''};
    const teacherOpts = '<option value="">請選擇</option>' + TEACHER_FORM_OPTIONS.map(o =>
      '<option value="' + escapeHtml(o.short) + '"' + (o.short === entry.teacher ? ' selected' : '') + '>' + escapeHtml(o.name) + '</option>'
    ).join('');
    const classOpts = '<option value="">請選擇</option>' + CLASS_FORM_OPTIONS.map(c =>
      '<option value="' + escapeHtml(c) + '"' + (c === entry.class ? ' selected' : '') + '>' + escapeHtml(c) + '</option>'
    ).join('');
    return '<div class="rf-entry-card">' +
      '<div class="rf-entry-head">' +
        '<span class="rf-entry-badge"></span>' +
        '<span class="rf-entry-title"></span>' +
        '<button type="button" class="rf-entry-remove" aria-label="移除">✕</button>' +
      '</div>' +
      '<div class="rf-entry-fields">' +
        '<div class="rf-entry-field"><label>教師</label><select class="rf-entry-teacher">' + teacherOpts + '</select></div>' +
        '<div class="rf-entry-field"><label>班別</label><select class="rf-entry-class">' + classOpts + '</select></div>' +
      '</div>' +
      '</div>';
  }

  // Renumbers the "教師1 *"/"教師2"... badges and titles after add/remove, and
  // only lets the last remaining card's remove button hide (at least one entry required).
  function renumberEntries(){
    const cards = document.querySelectorAll('#rfEntries .rf-entry-card');
    cards.forEach((card, i) => {
      card.querySelector('.rf-entry-badge').textContent = String(i + 1);
      card.querySelector('.rf-entry-badge').style.background = ENTRY_BADGE_COLORS[i % ENTRY_BADGE_COLORS.length];
      card.querySelector('.rf-entry-title').innerHTML = '教師' + (i + 1) + (i === 0 ? ' <span class="rf-required">*</span>' : '');
      card.querySelector('.rf-entry-remove').style.visibility = (cards.length > 1) ? 'visible' : 'hidden';
    });
  }

  function addEntryRow(entry){
    const container = document.getElementById('rfEntries');
    const div = document.createElement('div');
    div.innerHTML = entryRowHtml(entry);
    container.appendChild(div.firstChild);
    renumberEntries();
  }

  function readEntriesFromForm(){
    return Array.from(document.querySelectorAll('#rfEntries .rf-entry-card')).map(row => ({
      teacher: row.querySelector('.rf-entry-teacher').value,
      class: row.querySelector('.rf-entry-class').value
    })).filter(e => e.teacher && e.class);
  }

  // prefill (optional, only used when record is null): {date, slotId} -- pre-fills
  // the add form when opened by clicking an empty cell in the 調堂記錄 grid.
  function openRescheduleForm(record, prefill){
    const form = document.getElementById('rfForm');
    form.reset();
    document.getElementById('rfEntries').innerHTML = '';
    document.getElementById('rfError').textContent = '';
    state.rescheduleEditingId = record ? record.id : null;
    document.getElementById('rfModalTitle').textContent = record ? '編輯調堂記錄' : '新增調堂記錄';
    document.getElementById('rfDeleteBtn').style.display = record ? 'inline-block' : 'none';

    if(record){
      document.getElementById('rfDate').value = record.date || '';
      document.getElementById('rfSlot').value = record.slotId || '';
      document.getElementById('rfNote').value = record.note || '';
      (record.entries && record.entries.length ? record.entries : [null]).forEach(addEntryRow);
    } else {
      document.getElementById('rfDate').value = (prefill && prefill.date) || toKey(state.date);
      if(prefill && prefill.slotId) document.getElementById('rfSlot').value = prefill.slotId;
      addEntryRow(null);
      addEntryRow(null);
    }
    document.getElementById('rfModalBackdrop').classList.add('open');
  }
  function closeRescheduleForm(){
    document.getElementById('rfModalBackdrop').classList.remove('open');
    state.rescheduleEditingId = null;
  }

  function submitRescheduleForm(e){
    e.preventDefault();
    const errEl = document.getElementById('rfError');
    errEl.textContent = '';

    if(!window.__fb || !window.__fb.ready){
      errEl.textContent = '無法連線到資料庫，請檢查網絡連線後重試。';
      return;
    }

    const date = document.getElementById('rfDate').value;
    const slotId = document.getElementById('rfSlot').value;
    const note = document.getElementById('rfNote').value.trim();
    const entries = readEntriesFromForm();

    if(!date || !slotId){
      errEl.textContent = '請選擇日期及節次。';
      return;
    }
    if(!entries.length){
      errEl.textContent = '請至少填寫一行老師與班別／狀態。';
      return;
    }

    const data = {date: date, slotId: slotId, entries: entries, note: note || null};

    const saveBtn = document.getElementById('rfSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const done = () => { saveBtn.disabled = false; saveBtn.textContent = '儲存'; };

    const promise = state.rescheduleEditingId
      ? window.__fb.updateReschedule(state.rescheduleEditingId, data)
      : window.__fb.addReschedule(data);

    promise.then(() => {
      done();
      closeRescheduleForm();
    }).catch(err => {
      done();
      errEl.textContent = '儲存失敗：' + (err && err.message ? err.message : '請檢查網絡連線');
    });
  }

  // Deleting a record (single or bulk cleanup) requires this password, since
  // there's no login system on this page.
  const DELETE_PASSWORD = '535800';
  function verifyDeletePassword(){
    const pwd = window.prompt('請輸入刪除密碼：');
    if(pwd === null) return false; // cancelled
    if(pwd !== DELETE_PASSWORD){
      window.alert('密碼錯誤，已取消刪除。');
      return false;
    }
    return true;
  }

  function deleteRescheduleRecord(){
    if(!state.rescheduleEditingId) return;
    if(!window.confirm('確定要刪除這筆調堂記錄嗎？')) return;
    if(!verifyDeletePassword()) return;
    if(!window.__fb || !window.__fb.ready){
      document.getElementById('rfError').textContent = '無法連線到資料庫，請檢查網絡連線後重試。';
      return;
    }
    const id = state.rescheduleEditingId;
    window.__fb.deleteReschedule(id).then(() => {
      closeRescheduleForm();
    }).catch(err => {
      document.getElementById('rfError').textContent = '刪除失敗：' + (err && err.message ? err.message : '請檢查網絡連線');
    });
  }

  // ---------- admin: periodic cleanup of old records ----------
  function openCleanupModal(){
    document.getElementById('cleanupBeforeDate').value = '';
    document.getElementById('cleanupPreview').textContent = '';
    document.getElementById('cleanupModalBackdrop').classList.add('open');
  }
  function closeCleanupModal(){
    document.getElementById('cleanupModalBackdrop').classList.remove('open');
  }
  function recordsBefore(dateKey){
    return state.reschedules.filter(r => r.date && r.date < dateKey);
  }
  function updateCleanupPreview(){
    const before = document.getElementById('cleanupBeforeDate').value;
    const previewEl = document.getElementById('cleanupPreview');
    if(!before){ previewEl.textContent = ''; return; }
    const count = recordsBefore(before).length;
    previewEl.textContent = count
      ? ('將刪除 ' + count + ' 筆（' + before + ' 之前）的調堂記錄，此操作無法復原。')
      : ('沒有 ' + before + ' 之前的記錄。');
  }
  function confirmCleanup(){
    const before = document.getElementById('cleanupBeforeDate').value;
    if(!before) return;
    const toDelete = recordsBefore(before);
    if(!toDelete.length){ window.alert('沒有符合條件的記錄。'); return; }
    if(!window.confirm('確定要刪除 ' + toDelete.length + ' 筆 ' + before + ' 之前的調堂記錄嗎？此操作無法復原。')) return;
    if(!verifyDeletePassword()) return;
    if(!window.__fb || !window.__fb.ready){ window.alert('無法連線到資料庫，請檢查網絡連線後重試。'); return; }
    const btn = document.getElementById('cleanupConfirmBtn');
    btn.disabled = true;
    let done = 0, failed = 0;
    function next(i){
      if(i >= toDelete.length){
        btn.disabled = false;
        btn.textContent = '刪除';
        window.alert('清理完成：成功刪除 ' + done + ' 筆' + (failed ? '，失敗 ' + failed + ' 筆' : '') + '。');
        closeCleanupModal();
        return;
      }
      btn.textContent = '刪除中… (' + (i+1) + '/' + toDelete.length + ')';
      window.__fb.deleteReschedule(toDelete[i].id).then(() => {
        done++;
      }).catch(() => {
        failed++;
      }).finally(() => next(i+1));
    }
    next(0);
  }

  // ---------- 共同空堂 (mutual free periods) ----------
  // Independent of the 調堂記錄 feature: given 2-6 selected teachers, finds
  // every Day1-6 lesson period where ALL of them have no lesson at all (any
  // parity counts as "not free", since a single/double-week lesson still
  // means the slot can't be reliably used). Pure client-side computation
  // over the existing TEACHERS timetable data -- no Firebase involved.
  const MF_DAYS = ['Day1', 'Day2', 'Day3', 'Day4', 'Day5', 'Day6'];
  const MF_TEACHER_OPTIONS = TEACHERS.map(t => ({
    fullName: t.name,
    display: stripHomeroomTag(t.name),
    short: TEACHER_SHORT_BY_FULLNAME[t.name] || null
  }));
  function mfChipLabel(o){
    return '<span>' + escapeHtml(o.display) + '</span>';
  }
  function mfMatches(o, q){
    q = q.toLowerCase();
    return o.display.toLowerCase().indexOf(q) !== -1 ||
      (o.short && o.short.toLowerCase().indexOf(q) !== -1) ||
      o.fullName.toLowerCase().indexOf(q) !== -1;
  }

  function renderMfChips(){
    const wrap = document.getElementById('mfChips');
    wrap.innerHTML = state.mfSelected.map(name => {
      const o = MF_TEACHER_OPTIONS.find(t => t.fullName === name);
      if(!o) return '';
      return '<span class="mf-chip">' + mfChipLabel(o) +
        '<button type="button" class="mf-chip-remove" data-name="' + escapeHtml(name) + '" aria-label="移除">✕</button></span>';
    }).join('');
  }
  function renderMfDropdown(query){
    const dd = document.getElementById('mfDropdown');
    const q = (query || '').trim();
    const avail = MF_TEACHER_OPTIONS.filter(o => state.mfSelected.indexOf(o.fullName) === -1);
    const filtered = q ? avail.filter(o => mfMatches(o, q)) : avail;
    dd.innerHTML = filtered.length
      ? filtered.map(o => '<div class="mf-dropdown-item" data-name="' + escapeHtml(o.fullName) + '">' + mfChipLabel(o) + '</div>').join('')
      : '<div class="mf-dropdown-empty">沒有符合的教師。</div>';
  }
  function openMfDropdown(){
    renderMfDropdown(document.getElementById('mfSearchInput').value);
    document.getElementById('mfDropdown').classList.add('open');
  }
  function closeMfDropdown(){
    document.getElementById('mfDropdown').classList.remove('open');
  }
  function addMfTeacher(name){
    if(state.mfSelected.indexOf(name) !== -1) return;
    if(state.mfSelected.length >= 6){ window.alert('最多只能選擇 6 位教師。'); return; }
    state.mfSelected.push(name);
    document.getElementById('mfSearchInput').value = '';
    renderMfChips();
    renderMfResults();
    openMfDropdown();
  }
  function removeMfTeacher(name){
    state.mfSelected = state.mfSelected.filter(n => n !== name);
    renderMfChips();
    renderMfResults();
  }

  function mfTeacherFreeAt(teacherObj, day, periodIdx){
    const period = teacherObj.periods[periodIdx];
    const list = period ? period.byDay[day] : null;
    return !list || list.length === 0;
  }
  function computeMutualFree(){
    const teacherObjs = state.mfSelected.map(name => TEACHERS.find(t => t.name === name)).filter(Boolean);
    const results = [];
    MF_DAYS.forEach(day => {
      const freePeriods = PERIOD_OPTIONS.filter(p => teacherObjs.every(t => mfTeacherFreeAt(t, day, p.idx)));
      if(freePeriods.length) results.push({day: day, periods: freePeriods});
    });
    return results;
  }
  function renderMfResults(){
    const el = document.getElementById('mfResults');
    if(state.mfSelected.length < 2){
      el.innerHTML = '<div class="mf-empty-msg">請選擇至少 2 位教師，查看他們的共同空堂。</div>';
      return;
    }
    const results = computeMutualFree();
    if(!results.length){
      el.innerHTML = '<div class="mf-empty-msg">所選教師在 Day 1 至 Day 6 沒有共同空堂。</div>';
      return;
    }
    el.innerHTML = results.map(r => {
      const rows = r.periods.map(p =>
        '<div class="mf-row"><span class="mf-row-check">✓</span>' +
        '<span class="mf-row-period">' + p.label + '</span>' +
        '<span class="mf-row-time">' + p.time + '</span>' +
        '<span class="mf-row-tag">共同空堂</span></div>'
      ).join('');
      return '<div class="mf-day-group">' +
        '<div class="mf-day-header"><h4>' + r.day.replace('Day', 'Day ') + '</h4>' +
        '<span class="mf-day-badge">' + r.periods.length + ' 節共同空堂</span></div>' +
        rows +
        '</div>';
    }).join('');
  }

  function initMutualFree(){
    renderMfChips();
    renderMfResults();

    const searchInput = document.getElementById('mfSearchInput');
    searchInput.addEventListener('input', (e) => { renderMfDropdown(e.target.value); openMfDropdown(); });
    searchInput.addEventListener('focus', openMfDropdown);
    document.getElementById('mfComboToggle').addEventListener('click', () => {
      const dd = document.getElementById('mfDropdown');
      if(dd.classList.contains('open')) closeMfDropdown(); else openMfDropdown();
    });
    document.getElementById('mfDropdown').addEventListener('click', (e) => {
      const item = e.target.closest('.mf-dropdown-item');
      if(item) addMfTeacher(item.dataset.name);
    });
    document.getElementById('mfChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.mf-chip-remove');
      if(btn) removeMfTeacher(btn.dataset.name);
    });
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.mf-combo')) closeMfDropdown();
    });
  }

  function initReschedule(){
    populateFormSelects();

    function start(){
      const statusEl = document.getElementById('rescheduleStatus');
      if(!window.__fb || !window.__fb.ready){
        statusEl.textContent = '無法連線到資料庫（Firebase 未設定或離線）';
        statusEl.className = 'reschedule-status err';
        return;
      }
      window.__fb.listenReschedules(
        (records) => {
          state.reschedules = records;
          statusEl.textContent = '即時同步中';
          statusEl.className = 'reschedule-status ok';
          if(state.mode === 'reschedule' || state.mode === 'teacher' || state.mode === 'class') renderAll();
        },
        (err) => {
          statusEl.textContent = '連線失敗：' + (err && err.message ? err.message : '未知錯誤');
          statusEl.className = 'reschedule-status err';
        }
      );
    }
    if(window.__fb){ start(); }
    else { window.addEventListener('fb-bridge-ready', start, {once:true}); }

    document.getElementById('rescheduleAddBtn').addEventListener('click', () => openRescheduleForm(null));
    document.getElementById('rescheduleSearch').addEventListener('input', (e) => {
      state.rescheduleSearchQuery = e.target.value;
      state.rescheduleListLimit = RESCHEDULE_LIST_PAGE_SIZE;
      renderRescheduleList();
    });
    document.getElementById('rescheduleMonthSelect').addEventListener('change', (e) => {
      state.rescheduleMonthFilter = e.target.value;
      state.rescheduleListLimit = RESCHEDULE_LIST_PAGE_SIZE;
      renderRescheduleList();
    });
    document.getElementById('rescheduleCleanupBtn').addEventListener('click', openCleanupModal);
    document.getElementById('cleanupModalClose').addEventListener('click', closeCleanupModal);
    document.getElementById('cleanupCancelBtn').addEventListener('click', closeCleanupModal);
    document.getElementById('cleanupConfirmBtn').addEventListener('click', confirmCleanup);
    document.getElementById('cleanupBeforeDate').addEventListener('change', updateCleanupPreview);
    document.getElementById('cleanupModalBackdrop').addEventListener('click', (e) => {
      if(e.target.id === 'cleanupModalBackdrop') closeCleanupModal();
    });
    document.querySelectorAll('#rescheduleViewToggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        if(state.rescheduleViewMode === btn.dataset.rview) return;
        state.rescheduleViewMode = btn.dataset.rview;
        updateModeLayout();
        renderAll();
      });
    });
    document.getElementById('rescheduleList').addEventListener('click', (e) => {
      if(e.target.id === 'rsLoadMoreBtn'){
        state.rescheduleListLimit += RESCHEDULE_LIST_PAGE_SIZE;
        renderRescheduleList();
        return;
      }
      const card = e.target.closest('.rs-card');
      if(!card) return;
      const record = state.reschedules.find(r => r.id === card.dataset.id);
      if(record) openRescheduleForm(record);
    });
    document.getElementById('rfForm').addEventListener('submit', submitRescheduleForm);
    document.getElementById('rfDeleteBtn').addEventListener('click', deleteRescheduleRecord);
    document.getElementById('rfCancelBtn').addEventListener('click', closeRescheduleForm);
    document.getElementById('rfModalClose').addEventListener('click', closeRescheduleForm);
    document.getElementById('rfModalBackdrop').addEventListener('click', (e) => {
      if(e.target.id === 'rfModalBackdrop') closeRescheduleForm();
    });
    document.getElementById('rfAddEntryBtn').addEventListener('click', () => addEntryRow(null));
    document.getElementById('rfEntries').addEventListener('click', (e) => {
      const btn = e.target.closest('.rf-entry-remove');
      if(!btn) return;
      const cards = document.querySelectorAll('#rfEntries .rf-entry-card');
      if(cards.length <= 1){ btn.closest('.rf-entry-card').remove(); addEntryRow(null); return; }
      btn.closest('.rf-entry-card').remove();
      renumberEntries();
    });
  }

  // ---------- init ----------
  function init(){
    populateEntitySelect();
    updateModeLayout();
    renderAll();

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('nextBtn').addEventListener('click', goNext);
    document.getElementById('todayBtn').addEventListener('click', goToday);
    document.getElementById('viewWeekBtn').addEventListener('click', () => setView('week'));
    document.getElementById('viewDayBtn').addEventListener('click', () => setView('day'));

    document.querySelectorAll('#modeToggle button').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    document.getElementById('entitySelect').addEventListener('change', (e) => {
      state.entityIdx[state.mode] = Number(e.target.value);
      renderAll();
    });

    document.getElementById('calBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if(state.calOpen) closeCalendar(); else openCalendar();
    });
    document.getElementById('calPop').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => { if(state.calOpen) closeCalendar(); });

    document.getElementById('tabDate').addEventListener('click', () => { state.calTab='date'; renderCalendarPopover(); });
    document.getElementById('tabWeek').addEventListener('click', () => { state.calTab='week'; renderCalendarPopover(); });

    document.getElementById('cpPrevMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()-1, 1);
      renderMonthGrid();
    });
    document.getElementById('cpNextMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()+1, 1);
      renderMonthGrid();
    });

    document.getElementById('ttTable').addEventListener('click', (e) => {
      if(state.mode === 'reschedule'){
        const addBtn = e.target.closest('.rg-add-btn');
        if(addBtn){
          openRescheduleForm(null, {date: addBtn.dataset.dateKey, slotId: addBtn.dataset.slotId});
          return;
        }
        const box = e.target.closest('.rg-record-box');
        if(box){
          const record = state.reschedules.find(r => r.id === box.dataset.reschedId);
          if(record) openRescheduleForm(record);
        }
        return;
      }
      const cell = e.target.closest('td.cell.clickable');
      if(!cell) return;
      if(cell.dataset.reschedId){
        const record = state.reschedules.find(r => r.id === cell.dataset.reschedId);
        if(record) openRescheduleForm(record);
        return;
      }
      const dateKey = cell.dataset.dateKey;
      if(!dateKey) return;
      if(cell.dataset.dutySlot){
        openFreeModal(dateKey, {kind:'duty', slot: cell.dataset.dutySlot});
      } else if(cell.dataset.periodIdx !== undefined && cell.dataset.periodIdx !== ''){
        openFreeModal(dateKey, {kind:'period', idx: Number(cell.dataset.periodIdx)});
      }
    });
    document.getElementById('freeModalClose').addEventListener('click', closeFreeModal);
    document.getElementById('freeModalBackdrop').addEventListener('click', (e) => {
      if(e.target.id === 'freeModalBackdrop') closeFreeModal();
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){ closeFreeModal(); closeRescheduleForm(); closeCleanupModal(); }
    });

    initReschedule();
    initMutualFree();
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
